<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430">
  <rect width="800" height="430" fill="#111111"/>

  <!-- cabeçalho -->
  <text x="40" y="58" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="40" fill="#ece6d9">JANELA DO PITCH</text>
  <text x="760" y="56" font-family="JetBrains Mono" font-size="13" fill="#9b958a" text-anchor="end">Spotify for Artists</text>
  <line x1="40" y1="74" x2="760" y2="74" stroke="#2b2926" stroke-width="2" stroke-linecap="square"/>

  <!-- zona fora do prazo (hachurada) -->
  <rect x="545" y="240" width="95" height="60" fill="none" stroke="#2b2926" stroke-width="2"/>
  <g stroke="#2b2926" stroke-width="2" stroke-linecap="square">
    <line x1="545" y1="260" x2="565" y2="240"/>
    <line x1="545" y1="280" x2="585" y2="240"/>
    <line x1="545" y1="300" x2="605" y2="240"/>
    <line x1="565" y1="300" x2="625" y2="240"/>
    <line x1="585" y1="300" x2="640" y2="245"/>
    <line x1="605" y1="300" x2="640" y2="265"/>
    <line x1="625" y1="300" x2="640" y2="285"/>
  </g>
  <rect x="557" y="251" width="71" height="40" fill="#111111"/>
  <text x="592" y="267" font-family="JetBrains Mono" font-size="13" fill="#9b958a" text-anchor="middle">fora do</text>
  <text x="592" y="284" font-family="JetBrains Mono" font-size="13" fill="#9b958a" text-anchor="middle">prazo</text>

  <!-- eixo -->
  <line x1="40" y1="200" x2="760" y2="200" stroke="#ece6d9" stroke-width="3" stroke-linecap="square"/>
  <g stroke="#ece6d9" stroke-width="2" stroke-linecap="square">
    <line x1="165" y1="194" x2="165" y2="206"/>
    <line x1="355" y1="194" x2="355" y2="206"/>
    <line x1="450" y1="194" x2="450" y2="206"/>
  </g>
  <g font-family="JetBrains Mono" font-size="13" fill="#ece6d9" text-anchor="middle">
    <text x="70" y="226">-6 sem</text>
    <text x="165" y="226">-5</text>
    <text x="260" y="226">-4</text>
    <text x="355" y="226">-3</text>
    <text x="450" y="226">-2</text>
    <text x="545" y="226" fill="#e0261b" font-weight="700">-7 dias</text>
    <text x="640" y="226">0</text>
  </g>
  <text x="760" y="226" font-family="JetBrains Mono" font-size="13" fill="#9b958a" text-anchor="end">semanas</text>

  <!-- evento: distribuidor -->
  <text x="62" y="150" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">envio ao distribuidor</text>
  <line x1="70" y1="160" x2="70" y2="194" stroke="#ece6d9" stroke-width="2" stroke-linecap="square"/>
  <rect x="63" y="193" width="14" height="14" fill="#ece6d9"/>

  <!-- evento: upcoming -->
  <text x="252" y="150" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">faixa em Upcoming</text>
  <line x1="260" y1="160" x2="260" y2="194" stroke="#ece6d9" stroke-width="2" stroke-linecap="square"/>
  <rect x="253" y="193" width="14" height="14" fill="#ece6d9"/>

  <!-- zona ideal -->
  <rect x="260" y="240" width="95" height="60" fill="#ece6d9"/>
  <text x="307" y="266" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="22" fill="#070707" text-anchor="middle">MIRE</text>
  <text x="307" y="290" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="22" fill="#070707" text-anchor="middle">AQUI</text>
  <text x="367" y="264" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">3 a 4 semanas antes</text>
  <text x="367" y="286" font-family="JetBrains Mono" font-size="13" fill="#9b958a">tempo pro editor ouvir</text>

  <!-- limite -->
  <line x1="545" y1="120" x2="545" y2="208" stroke="#e0261b" stroke-width="4" stroke-linecap="square"/>
  <line x1="545" y1="236" x2="545" y2="300" stroke="#e0261b" stroke-width="4" stroke-linecap="square"/>
  <text x="535" y="112" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#e0261b" text-anchor="end">LIMITE: 7 DIAS ANTES</text>

  <!-- lançamento -->
  <text x="640" y="150" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#ece6d9" text-anchor="middle">SEXTA</text>
  <line x1="640" y1="160" x2="640" y2="194" stroke="#ece6d9" stroke-width="2" stroke-linecap="square"/>
  <rect x="631" y="191" width="18" height="18" fill="#e0261b"/>

  <!-- janela válida e Release Radar -->
  <path d="M260 330 L260 342 L545 342 L545 330" fill="none" stroke="#e0261b" stroke-width="3" stroke-linecap="square"/>
  <text x="260" y="364" font-family="JetBrains Mono" font-size="13" font-weight="700" fill="#ece6d9">pitch dentro do prazo</text>
  <line x1="545" y1="342" x2="586" y2="342" stroke="#e0261b" stroke-width="3" stroke-linecap="square"/>
  <polygon points="586,334 600,342 586,350" fill="#e0261b"/>
  <rect x="604" y="314" width="156" height="56" fill="#e0261b"/>
  <text x="614" y="340" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="22" fill="#111111">RELEASE RADAR</text>
  <text x="614" y="360" font-family="JetBrains Mono" font-size="13" fill="#111111">dos seguidores</text>

  <!-- rodapé -->
  <line x1="40" y1="388" x2="760" y2="388" stroke="#2b2926" stroke-width="2" stroke-linecap="square"/>
  <text x="40" y="412" font-family="JetBrains Mono" font-size="13" fill="#9b958a">uma música por vez · pitch não garante playlist editorial · 7 dias é limite, não meta</text>
</svg>
