<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#111111"/>

  <!-- cabeçalho -->
  <text x="20" y="42" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="34" fill="#ece6d9">SANGRIA, CORTE E MARGEM</text>
  <text x="780" y="42" text-anchor="end" font-family="JetBrains Mono" font-size="13" fill="#9b958a">CARTAZ A3 PARA GRÁFICA</text>
  <rect x="20" y="54" width="760" height="4" fill="#e0261b"/>

  <!-- sangria (faixa externa) -->
  <rect x="60" y="94" width="352" height="481" fill="#e0261b"/>
  <!-- área final, até o corte -->
  <rect x="80" y="114" width="312" height="441" fill="#111111"/>
  <!-- linha de corte -->
  <rect x="80" y="114" width="312" height="441" fill="none" stroke="#ece6d9" stroke-width="2.5"/>
  <!-- margem de segurança -->
  <rect x="106" y="140" width="260" height="389" fill="none" stroke="#ece6d9" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- marcas de corte -->
  <path d="M80 70 V86 M392 70 V86 M80 583 V599 M392 583 V599 M36 114 H52 M36 555 H52 M420 114 H436 M420 555 H436" stroke="#ece6d9" stroke-width="1.5"/>

  <!-- conteúdo dentro da área útil -->
  <text x="124" y="226" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="96" fill="#ece6d9">COVA</text>
  <text x="124" y="312" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="96" fill="#ece6d9">RASA</text>
  <rect x="124" y="330" width="224" height="8" fill="#e0261b"/>
  <rect x="124" y="356" width="150" height="14" fill="#ece6d9"/>
  <rect x="124" y="380" width="118" height="8" fill="#ece6d9"/>
  <rect x="124" y="396" width="96" height="8" fill="#ece6d9"/>
  <rect x="124" y="496" width="84" height="8" fill="#9b958a"/>
  <rect x="124" y="510" width="60" height="8" fill="#9b958a"/>

  <!-- linhas de chamada -->
  <circle cx="402" cy="160" r="4" fill="#ece6d9"/>
  <path d="M402 160 H444" stroke="#ece6d9" stroke-width="1.5"/>
  <circle cx="392" cy="262" r="4" fill="#ece6d9"/>
  <path d="M392 262 H444" stroke="#ece6d9" stroke-width="1.5"/>
  <circle cx="366" cy="372" r="4" fill="#ece6d9"/>
  <path d="M366 372 H444" stroke="#ece6d9" stroke-width="1.5"/>
  <circle cx="300" cy="462" r="4" fill="#e0261b"/>
  <path d="M300 462 H444" stroke="#e0261b" stroke-width="1.5"/>

  <!-- legenda -->
  <rect x="456" y="146" width="14" height="14" fill="#e0261b"/>
  <text x="480" y="160" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#e0261b">SANGRIA</text>
  <text x="480" y="182" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">3 mm além do corte, por lado</text>
  <text x="480" y="200" font-family="JetBrains Mono" font-size="13" fill="#9b958a">fundo e imagem vão até aqui</text>

  <path d="M456 255 H470" stroke="#ece6d9" stroke-width="2.5"/>
  <text x="480" y="262" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#ece6d9">LINHA DE CORTE</text>
  <text x="480" y="284" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">A3 final: 297 × 420 mm</text>
  <text x="480" y="302" font-family="JetBrains Mono" font-size="13" fill="#9b958a">com sangria: 303 × 426 mm</text>

  <path d="M456 365 H470" stroke="#ece6d9" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="372" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#ece6d9">MARGEM DE SEGURANÇA</text>
  <text x="480" y="394" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">3 a 5 mm para dentro do corte</text>
  <text x="480" y="412" font-family="JetBrains Mono" font-size="13" fill="#9b958a">nenhum texto passa dela</text>

  <rect x="456" y="448" width="14" height="14" fill="none" stroke="#e0261b" stroke-width="2"/>
  <text x="480" y="462" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="24" fill="#ece6d9">ÁREA ÚTIL</text>
  <text x="480" y="484" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">nome, data, local, preço</text>
  <text x="480" y="502" font-family="JetBrains Mono" font-size="13" fill="#9b958a">imagens a 300 dpi</text>

  <text x="456" y="556" font-family="JetBrains Mono" font-size="13" fill="#9b958a">FORA DE ESCALA: faixas</text>
  <text x="456" y="574" font-family="JetBrains Mono" font-size="13" fill="#9b958a">ampliadas para leitura</text>
</svg>
