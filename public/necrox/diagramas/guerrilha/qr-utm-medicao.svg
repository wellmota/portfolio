  <line x1="40" y1="442" x2="760" y2="442" stroke="#2b2926" stroke-width="2"/>
  <text x="40" y="468" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="22" fill="#ece6d9">04 PAINEL: VISITAS POR LUGAR</text>
