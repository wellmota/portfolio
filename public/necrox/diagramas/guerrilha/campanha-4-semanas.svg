<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#111111"/>
  <!-- cabeçalho -->
  <rect x="40" y="30" width="56" height="8" fill="#e0261b"/>
  <text x="40" y="86" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="54" fill="#ece6d9">CAMPANHA DE MISTÉRIO</text>
  <text x="40" y="110" font-family="JetBrains Mono" font-size="14" fill="#9b958a" letter-spacing="1">4 SEMANAS · DO SÍMBOLO À REVELAÇÃO</text>
  <line x1="40" y1="128" x2="760" y2="128" stroke="#2b2926" stroke-width="2"/>

  <!-- ícones -->
  <!-- semana 1: sigilo -->
  <g stroke="#ece6d9" stroke-width="4" stroke-linecap="square" fill="none">
    <polygon points="48,150 128,150 88,222" stroke-linejoin="miter"/>
    <line x1="70" y1="166" x2="106" y2="166"/>
    <line x1="76" y1="180" x2="100" y2="180"/>
    <line x1="82" y1="194" x2="94" y2="194"/>
  </g>
  <!-- semana 2: QR -->
  <g>
    <rect x="228" y="150" width="72" height="72" fill="#ece6d9"/>
    <rect x="234" y="156" width="20" height="20" fill="#070707"/>
    <rect x="238" y="160" width="12" height="12" fill="#ece6d9"/>
    <rect x="274" y="156" width="20" height="20" fill="#070707"/>
    <rect x="278" y="160" width="12" height="12" fill="#ece6d9"/>
    <rect x="234" y="196" width="20" height="20" fill="#070707"/>
    <rect x="238" y="200" width="12" height="12" fill="#ece6d9"/>
    <rect x="260" y="182" width="8" height="8" fill="#070707"/>
    <rect x="276" y="186" width="8" height="8" fill="#070707"/>
    <rect x="266" y="198" width="8" height="8" fill="#070707"/>
    <rect x="282" y="204" width="8" height="8" fill="#070707"/>
    <rect x="260" y="210" width="6" height="6" fill="#070707"/>
  </g>
  <text x="312" y="176" font-family="Instrument Serif" font-style="italic" font-size="18" fill="#9b958a">o solo</text>
  <text x="312" y="198" font-family="Instrument Serif" font-style="italic" font-size="18" fill="#9b958a">lembra</text>
  <!-- semana 3: contagem -->
  <rect x="408" y="150" width="112" height="72" fill="none" stroke="#ece6d9" stroke-width="4"/>
  <text x="464" y="207" text-anchor="middle" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="50" fill="#ece6d9">D-07</text>
  <!-- semana 4: revelação -->
  <rect x="588" y="150" width="72" height="72" fill="#e0261b"/>
  <polygon points="600,164 648,164 624,208" fill="#111111"/>
  <text x="672" y="176" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">O SÍMBOLO</text>
  <text x="672" y="194" font-family="JetBrains Mono" font-size="13" fill="#ece6d9">VIRA CAPA</text>

  <!-- linha do tempo -->
  <text x="48" y="252" font-family="JetBrains Mono" font-size="13" fill="#9b958a">SEM 01</text>
  <text x="228" y="252" font-family="JetBrains Mono" font-size="13" fill="#9b958a">SEM 02</text>
  <text x="408" y="252" font-family="JetBrains Mono" font-size="13" fill="#9b958a">SEM 03</text>
  <text x="588" y="252" font-family="JetBrains Mono" font-size="13" fill="#e0261b">SEM 04</text>
  <rect x="40" y="262" width="172" height="12" fill="#ece6d9"/>
  <rect x="220" y="262" width="172" height="12" fill="#ece6d9"/>
  <rect x="400" y="262" width="172" height="12" fill="#ece6d9"/>
  <rect x="580" y="262" width="160" height="12" fill="#e0261b"/>
  <polygon points="740,254 764,268 740,282" fill="#e0261b"/>

  <!-- etapas -->
  <g font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="30">
    <text x="48" y="314" fill="#ece6d9">O SÍMBOLO</text>
    <text x="228" y="314" fill="#ece6d9">A PISTA</text>
    <text x="408" y="314" fill="#ece6d9">A CONTAGEM</text>
    <text x="588" y="314" fill="#e0261b">A REVELAÇÃO</text>
  </g>
  <g font-family="JetBrains Mono" font-size="13" fill="#ece6d9">
    <text x="48" y="340">sigilo sem nome</text>
    <text x="48" y="358">adesivo no merch</text>
    <text x="48" y="376">cartaz autorizado</text>
    <text x="48" y="394">stories da banda</text>

    <text x="228" y="340">QR ou frase curta</text>
    <text x="228" y="358">página com data</text>
    <text x="228" y="376">áudio de 15 s</text>

    <text x="408" y="340">dias que faltam</text>
    <text x="408" y="358">capa revelada</text>
    <text x="408" y="376">aos pedaços</text>

    <text x="588" y="340">nome e data</text>
    <text x="588" y="358">link de pré-venda</text>
    <text x="588" y="376">brinde para quem</text>
    <text x="588" y="394">acompanhou</text>
  </g>

  <line x1="40" y1="414" x2="760" y2="414" stroke="#2b2926" stroke-width="2"/>
  <text x="40" y="438" font-family="Instrument Serif" font-style="italic" font-size="18" fill="#9b958a">Banda pequena: duas a quatro semanas bastam. Mistério longo demais vira esquecimento.</text>
</svg>
