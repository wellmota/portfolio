<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590">
  <rect width="800" height="590" fill="#111111"/>
  <line x1="40" y1="350" x2="760" y2="350" stroke="#2b2926" stroke-width="1"/>

  <text x="40" y="40" font-family="JetBrains Mono" font-size="13" fill="#9b958a" letter-spacing="1">CAIXA DA BANDA · REGRA DE EXEMPLO</text>
  <text x="40" y="84" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="40" fill="#ece6d9">TODO DINHEIRO PASSA PELO CAIXA</text>
  <rect x="40" y="96" width="96" height="6" fill="#e0261b"/>

  <!-- entradas -->
  <text x="40" y="136" font-family="JetBrains Mono" font-size="13" fill="#ece6d9" letter-spacing="1">ENTRADAS</text>
  <rect x="40" y="148" width="190" height="44" fill="#070707" stroke="#ece6d9" stroke-width="2"/>
  <text x="56" y="175" font-family="JetBrains Mono" font-size="14" fill="#ece6d9">cachê e porta</text>
  <rect x="40" y="208" width="190" height="44" fill="#070707" stroke="#ece6d9" stroke-width="2"/>
  <text x="56" y="235" font-family="JetBrains Mono" font-size="14" fill="#ece6d9">merch</text>
  <rect x="40" y="268" width="190" height="44" fill="#070707" stroke="#ece6d9" stroke-width="2"/>
  <text x="56" y="295" font-family="JetBrains Mono" font-size="14" fill="#ece6d9">vendas digitais</text>

  <g stroke="#ece6d9" stroke-width="3" stroke-linecap="square" fill="none">
    <line x1="232" y1="170" x2="262" y2="170"/>
    <line x1="232" y1="230" x2="262" y2="230"/>
    <line x1="232" y1="290" x2="262" y2="290"/>
    <line x1="262" y1="170" x2="262" y2="290"/>
    <line x1="262" y1="230" x2="286" y2="230"/>
  </g>
  <polygon points="298,230 286,223 286,237" fill="#ece6d9"/>

  <!-- caixa -->
  <rect x="300" y="150" width="200" height="160" fill="#ece6d9"/>
  <text x="400" y="236" text-anchor="middle" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="60" fill="#111111">CAIXA</text>
  <text x="400" y="264" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#111111">conta só da banda</text>
  <text x="400" y="282" text-anchor="middle" font-family="JetBrains Mono" font-size="13" fill="#111111">+ planilha mensal</text>

  <!-- saídas -->
  <text x="570" y="136" font-family="JetBrains Mono" font-size="13" fill="#e0261b" letter-spacing="1">SAÍDAS</text>
  <g stroke="#e0261b" stroke-width="2" fill="#070707">
    <rect x="570" y="148" width="190" height="36"/>
    <rect x="570" y="196" width="190" height="36"/>
    <rect x="570" y="244" width="190" height="36"/>
    <rect x="570" y="292" width="190" height="36"/>
  </g>
  <g font-family="JetBrains Mono" font-size="14" fill="#ece6d9">
    <text x="586" y="171">ensaio</text>
    <text x="586" y="219">gravação</text>
    <text x="586" y="267">combustível</text>
    <text x="586" y="315">impressão</text>
  </g>
  <g stroke="#e0261b" stroke-width="3" stroke-linecap="square" fill="none">
    <line x1="502" y1="230" x2="536" y2="230"/>
    <line x1="536" y1="166" x2="536" y2="310"/>
    <line x1="536" y1="166" x2="556" y2="166"/>
    <line x1="536" y1="214" x2="556" y2="214"/>
    <line x1="536" y1="262" x2="556" y2="262"/>
    <line x1="536" y1="310" x2="556" y2="310"/>
  </g>
  <g fill="#e0261b">
    <polygon points="568,166 556,159 556,173"/>
    <polygon points="568,214 556,207 556,221"/>
    <polygon points="568,262 556,255 556,269"/>
    <polygon points="568,310 556,303 556,317"/>
  </g>

  <!-- divisão -->
  <text x="40" y="384" font-family="JetBrains Mono" font-size="13" fill="#e0261b" letter-spacing="1">A DIVISÃO, COMBINADA ANTES (EXEMPLO: BANDA DE 4)</text>

  <rect x="40" y="398" width="32" height="32" fill="#ece6d9"/>
  <text x="56" y="423" text-anchor="middle" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="26" fill="#111111">1</text>
  <text x="88" y="419" font-family="JetBrains Mono" font-size="14" fill="#ece6d9">reembolsa primeiro quem adiantou dinheiro do próprio bolso</text>

  <rect x="40" y="444" width="32" height="32" fill="#ece6d9"/>
  <text x="56" y="469" text-anchor="middle" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="26" fill="#111111">2</text>
  <text x="88" y="465" font-family="JetBrains Mono" font-size="14" fill="#ece6d9">o restante se divide numa regra fixa:</text>

  <rect x="40" y="490" width="216" height="52" fill="#e0261b"/>
  <text x="148" y="524" text-anchor="middle" font-family="Archivo Variable" font-weight="900" style="font-stretch:62%;font-variation-settings:'wdth' 62" font-size="26" fill="#111111">30% CAIXA</text>
  <g fill="#070707" stroke="#ece6d9" stroke-width="2">
    <rect x="256" y="490" width="126" height="52"/>
    <rect x="382" y="490" width="126" height="52"/>
    <rect x="508" y="490" width="126" height="52"/>
    <rect x="634" y="490" width="126" height="52"/>
  </g>
  <g font-family="JetBrains Mono" font-size="13" fill="#ece6d9" text-anchor="middle">
    <text x="319" y="512">MEMBRO</text><text x="319" y="530" fill="#9b958a">17,5%</text>
    <text x="445" y="512">MEMBRO</text><text x="445" y="530" fill="#9b958a">17,5%</text>
    <text x="571" y="512">MEMBRO</text><text x="571" y="530" fill="#9b958a">17,5%</text>
    <text x="697" y="512">MEMBRO</text><text x="697" y="530" fill="#9b958a">17,5%</text>
  </g>

  <text x="40" y="570" font-family="JetBrains Mono" font-size="13" fill="#9b958a">ou tudo fica no caixa enquanto a banda investe em gravação ou turnê</text>
</svg>
