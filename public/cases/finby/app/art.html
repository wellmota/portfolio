<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Finby photos</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --cream: #faf7f3;
        --ink: #1b1730;
        --muted: #6e6782;
        --line: #efe9e1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 24px 48px;
        background: var(--cream);
        color: var(--ink);
        font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      h2 {
        margin: 36px 0 12px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, 360px);
        gap: 24px 20px;
      }
      figure {
        margin: 0;
      }
      .art {
        border-radius: 18px;
        overflow: hidden;
        background: #ebe5ff;
      }
      .art img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .art--full {
        width: 360px;
        height: 240px;
      }
      .art--done {
        width: 260px;
        height: 180px;
        border-radius: 28px;
      }
      .art--empty {
        width: 200px;
        height: 120px;
        border-radius: 20px;
      }
      .art--thumb {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      figcaption {
        margin-top: 8px;
        font-weight: 600;
      }
      figcaption code {
        font-weight: 400;
        color: var(--muted);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .row figcaption {
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>Finby photos</h1>
    <p>FB.art(kind) → Unsplash photo, object-fit: cover. Review sizes: full, success (260×180), empty state (200×120), list thumbnail (72×72).</p>

    <h2>360 × 240</h2>
    <div class="grid" id="full"></div>

    <h2>260 × 180 · success screens</h2>
    <div class="row" id="done"></div>

    <h2>200 × 120 · empty states</h2>
    <div class="row" id="empty"></div>

    <h2>72 × 72 · thumbnails</h2>
    <div class="row" id="thumbs"></div>

    <script src="assets/art.js"></script>
    <script>
      const LABEL = {
        beach: 'Viagem Bahia',
        graduation: 'Turma D · Medicina',
        path: 'Trabalho',
        fireworks: 'Réveillon 2027',
        cinema: 'TV 4K',
        campfire: 'Amigos da 6',
        invite: 'Convite enviado',
        celebrate: 'Consórcio publicado',
        payout: 'Saque a caminho',
        friends: 'Amigos',
        empty: 'Estado vazio',
      };
      const fig = (kind, size, caption) =>
        `<figure><div class="art art--${size}">${FB.art(kind)}</div><figcaption>${caption}</figcaption></figure>`;
      const kinds = FB.artKinds;
      document.getElementById('full').innerHTML = kinds.map((k) => fig(k, 'full', `${LABEL[k] || k} <code>${k}</code>`)).join('');
      document.getElementById('done').innerHTML = kinds.map((k) => fig(k, 'done', `<code>${k}</code>`)).join('');
      document.getElementById('empty').innerHTML = ['empty', 'friends', 'invite'].map((k) => fig(k, 'empty', `<code>${k}</code>`)).join('');
      document.getElementById('thumbs').innerHTML = kinds.map((k) => fig(k, 'thumb', `<code>${k}</code>`)).join('');
    </script>
  </body>
</html>
