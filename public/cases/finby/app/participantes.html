<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f3" />
    <title>Participantes · Finby</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="assets/app.css" />
    <style>
      /* Figma 4.2 Detalhe → "Participantes" (2017:2531): violet header with the consórcio name,
         "Ativos" friend cards, "Aguardando" grey cards with "Reenviar convite" / "Reenviar para todos". */

      /* header: consórcio name small, screen title large */
      .hero {
        padding-bottom: 26px;
      }
      .hero__kicker {
        margin-top: 4px;
        font-size: 15px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.88);
      }
      .hero__title {
        margin-top: 2px;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #fff;
      }
      /* once the header scrolls away, the floating status bar gets a surface so it stays legible */
      .statusbar {
        transition:
          background var(--t-med) var(--ease),
          color var(--t-med) var(--ease);
      }
      [data-status='light'].is-scrolled .statusbar {
        color: var(--ink);
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .section-head h2 .n {
        font-weight: 600;
        color: var(--muted);
      }
      #aguardando {
        scroll-margin-top: 56px;
      }

      /* a short line under the name: "Você", "Recebeu em 14/09", "Aceite pendente" */
      .friend__sub {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 1px;
      }
      .friend__sub .i {
        width: 13px;
        height: 13px;
      }
      .friend__sub--won {
        color: var(--green-700);
      }
      .friend__name {
        line-height: 1.3;
      }
      .friend__name > span:first-child {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* "+ 7 outros participantes": people the app does not list one by one */
      .friend--more {
        background: transparent;
        box-shadow: none;
        border: 1.5px dashed var(--line-strong);
      }
      .friend--more .friend__name {
        font-weight: 600;
        color: var(--muted);
      }
      .more-ico {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 50%;
        color: var(--ink-3);
        background: var(--sunken);
      }
      .more-ico .i {
        width: 20px;
        height: 20px;
      }

      /* Aguardando (Figma grey cards): sunken, name a step quieter, action on the right */
      .friend--wait {
        background: var(--sunken);
        box-shadow: none;
        padding-right: 8px;
      }
      .friend--wait .friend__name {
        color: var(--ink-2);
      }
      .friend--wait .av img {
        filter: saturate(0.85);
      }
      .resend {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        flex: none;
        min-height: 44px;
        padding: 0 12px;
        border-radius: var(--r-pill);
        font-size: 13.5px;
        font-weight: 700;
        color: var(--violet-700);
        background: var(--surface);
        box-shadow: var(--shadow-xs);
        transition:
          background var(--t-fast) var(--ease),
          color var(--t-fast) var(--ease),
          transform var(--t-fast) var(--ease);
      }
      .resend:hover {
        background: var(--violet-50);
      }
      .resend:active {
        transform: scale(0.96);
      }
      .resend .i {
        width: 16px;
        height: 16px;
      }
      .resend:disabled {
        color: var(--green-700);
        background: transparent;
        box-shadow: none;
        cursor: default;
        transform: none;
      }
      .resend:disabled .i {
        stroke-width: 2.6;
      }
      .link:disabled {
        color: var(--ink-3);
        cursor: default;
      }

      .note {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px 14px;
        border-radius: var(--r-md);
        background: var(--sunken);
        font-size: 13.5px;
        line-height: 1.45;
        color: var(--ink-2);
      }
      .note .i {
        width: 18px;
        height: 18px;
        margin-top: 1px;
        color: var(--violet-600);
      }
    </style>
  </head>
  <body data-status="light">
    <div class="app">
      <main class="screen screen--flush" id="main">
        <header class="hero" id="hero">
          <div class="topbar">
            <a class="icon-btn" id="back" href="consorcios.html" data-back aria-label="Voltar"><span data-icon="arrow-left"></span></a>
          </div>
          <p class="hero__kicker rise" id="kicker"></p>
          <h1 class="hero__title rise" style="--d: 1">Participantes</h1>
        </header>

        <div class="pad" id="content"></div>
      </main>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/art.js"></script>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const { esc, fmt } = FB;
        const params = new URLSearchParams(location.search);
        const id = params.get('id') || 'reveillon';
        const c = FB.get(id);
        const hero = document.getElementById('hero');
        const content = document.getElementById('content');
        const main = document.getElementById('main');

        /* status bar turns solid once the coloured header has scrolled under it */
        main.addEventListener(
          'scroll',
          () => document.body.classList.toggle('is-scrolled', main.scrollTop > hero.offsetHeight - 56),
          { passive: true }
        );

        if (!c) {
          hero.classList.add('theme-violet');
          document.getElementById('kicker').textContent = 'Finby';
          content.innerHTML = `<div class="empty rise" style="--d: 2">
            <div class="empty__art" data-art="empty"></div>
            <p class="t-h3">Consórcio não encontrado</p>
            <p class="t-body2">Ele pode ter sido encerrado ou o link está incompleto.</p>
            <a class="btn btn--sm mt-8" href="consorcios.html">Ver meus consórcios</a>
          </div>`;
          FB.hydrate(content);
          return;
        }

        hero.classList.add('theme-' + (c.theme || 'violet'));
        document.getElementById('back').href = `consorcio.html?id=${encodeURIComponent(c.id)}`;
        document.getElementById('kicker').textContent = c.name;
        document.title = `Participantes · ${c.name} · Finby`;

        const isAdmin = c.role === 'admin';
        const members = c.members || [];
        const extra = Math.max(0, (c.memberCount || 0) - members.length);
        const total = members.length + extra;
        const won = {};
        (c.winners || []).forEach((w) => (won[w.id] = new Date(w.date)));
        const waiting = (c.waiting || [])
          .map((w) => (typeof w === 'string' ? { id: w, pending: 'accept' } : w))
          /* people who still have to sign up need the most help: first, as in the Figma */
          .sort((a, b) => (a.pending === 'signup' ? 0 : 1) - (b.pending === 'signup' ? 0 : 1));

        const sub = (pid) => {
          const bits = [];
          if (pid === FB.me) bits.push(isAdmin ? 'Você · criou o consórcio' : 'Você');
          if (won[pid]) return `<span class="friend__sub friend__sub--won">${FB.icon('trophy')}${bits.length ? bits[0] + ' · ' : ''}Recebeu em ${fmt.ddmm(won[pid])}</span>`;
          return bits.length ? `<span class="friend__sub">${bits[0]}</span>` : '';
        };
        const activeRow = (pid, i) => {
          const p = FB.person(pid);
          return `<li class="friend rise" style="--d:${Math.min(i + 3, 10)}">
            ${FB.avatar(pid, { crown: true })}
            <span class="friend__name"><span>${esc(p.name)}</span>${sub(pid)}</span>
            ${FB.levelChip(p.level)}
          </li>`;
        };

        let html = `<section aria-labelledby="ativos-h">
          <div class="section-head rise" style="--d: 2">
            <h2 id="ativos-h">Ativos <span class="n">· ${total}</span></h2>
          </div>
          <ul class="list">
            ${members.map(activeRow).join('')}
            ${
              extra
                ? `<li class="friend friend--more rise" style="--d:${Math.min(members.length + 3, 10)}">
                    <span class="more-ico">${FB.icon('users')}</span>
                    <span class="friend__name">+ ${fmt.plural(extra, 'outro participante', 'outros participantes')}</span>
                  </li>`
                : ''
            }
          </ul>
        </section>`;

        if (waiting.length && isAdmin) {
          html += `<section id="aguardando" aria-labelledby="aguardando-h">
            <div class="section-head rise" style="--d: 6">
              <h2 id="aguardando-h">Aguardando <span class="n">· ${waiting.length}</span></h2>
              <button class="link" type="button" id="resend-all">Reenviar para todos</button>
            </div>
            <ul class="list" id="waiting">
              ${waiting
                .map((w, i) => {
                  const p = FB.person(w.id);
                  const status =
                    w.pending === 'signup'
                      ? `<span class="friend__sub danger">${FB.icon('alert')}Cadastro pendente</span>`
                      : `<span class="friend__sub">${FB.icon('hourglass')}Aceite pendente</span>`;
                  return `<li class="friend friend--wait rise" style="--d:${Math.min(i + 7, 12)}">
                    ${FB.avatar(w.id)}
                    <span class="friend__name"><span>${esc(p.name)}</span>${status}</span>
                    <button class="resend" type="button" data-resend="${esc(w.id)}" aria-label="Reenviar convite para ${esc(p.name)}">Reenviar convite</button>
                  </li>`;
                })
                .join('')}
            </ul>
          </section>`;
        } else if (isAdmin && c.status === 'forming') {
          html += `<p class="note mt-24 rise" style="--d: 6">${FB.icon('check')}Todo mundo que você convidou já aceitou.</p>`;
        }

        content.innerHTML = html;

        /* Reenviar convite: per row and for everyone */
        const all = document.getElementById('resend-all');
        const markSent = (b) => {
          b.disabled = true;
          b.innerHTML = FB.icon('check') + 'Enviado';
          b.setAttribute('aria-label', `Convite reenviado para ${FB.person(b.dataset.resend).name}`);
        };
        const pending = () => [...content.querySelectorAll('[data-resend]:not(:disabled)')];
        const syncAll = () => {
          if (all && !pending().length) all.disabled = true;
        };
        content.addEventListener('click', (e) => {
          const b = e.target.closest('[data-resend]');
          if (b && !b.disabled) {
            markSent(b);
            FB.toast(`Convite reenviado para ${FB.first(b.dataset.resend)}`, 'send');
            syncAll();
          }
        });
        if (all)
          all.addEventListener('click', () => {
            const left = pending();
            if (!left.length) return;
            left.forEach(markSent);
            FB.toast(`Convites reenviados para ${fmt.plural(left.length, 'pessoa', 'pessoas')}`, 'send');
            syncAll();
          });

        /* deep link: ?sent=1 shows every invite already re-sent */
        if (params.get('sent') && all) {
          pending().forEach(markSent);
          syncAll();
        }
        if (location.hash) {
          const t = document.getElementById(location.hash.slice(1));
          if (t) requestAnimationFrame(() => t.scrollIntoView({ block: 'start' }));
        }
      })();
    </script>
  </body>
</html>
