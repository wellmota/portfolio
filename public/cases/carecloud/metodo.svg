<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="O método: observar, entrevistar, mapear, prototipar e testar com clínicos, em ciclos; quatro meses in loco num ano de projeto">
<style>
  .mono{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.18em;text-transform:uppercase}
  .cap{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.04em;text-transform:uppercase}
  .sans{font-family:-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .b{font-weight:700;letter-spacing:-.02em}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c92"/></marker>
  <marker id="arra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8FD5"/></marker>
</defs>
<rect width="1200" height="820" fill="#0a0a0a"/>
<path d="M33,40 H47 M40,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M33,780 H47 M40,773 V787" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,40 H1167 M1160,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,780 H1167 M1160,773 V787" stroke="#3a3a3a" stroke-width="1"/>
<text x="40" y="52" class="mono" font-size="14" fill="#8c8c92">05 — O método</text><text x="1160" y="52" class="mono" font-size="14" fill="#8c8c92" text-anchor="end">4 meses in loco · ~1 ano no projeto</text><path d="M40,78 H1160" stroke="#232323" stroke-width="1"/><path d="M150,340 H1050" stroke="#3a3a3a" stroke-width="1"/><circle cx="150" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="150" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">01</text><text x="150" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="150" dy="0">Observar</tspan><tspan x="150" dy="28">de perto</tspan></text><text x="150" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="150" dy="0">enfermagem, recepção,</tspan><tspan x="150" dy="20">faturamento e o médico</tspan><tspan x="150" dy="20">entre uma sala e outra</tspan></text><circle cx="375" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="375" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">02</text><text x="375" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="375" dy="0">Entrevistar</tspan><tspan x="375" dy="28">clínicos</tspan></text><text x="375" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="375" dy="0">médicos, enfermeiros</tspan><tspan x="375" dy="20">e recepção, no escritório</tspan><tspan x="375" dy="20">da CareCloud em Miami</tspan></text><circle cx="600" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="600" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">03</text><text x="600" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="600" dy="0">Mapear</tspan><tspan x="600" dy="28">os fluxos</tspan></text><text x="600" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="600" dy="0">admissão, história, exame,</tspan><tspan x="600" dy="20">plano, prescrição</tspan><tspan x="600" dy="20">e faturamento</tspan></text><circle cx="825" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="825" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">04</text><text x="825" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="825" dy="0">Protótipo</tspan><tspan x="825" dy="28">hi-fi</tspan></text><text x="825" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="825" dy="0">Sketch e Axure, telas</tspan><tspan x="825" dy="20">navegáveis, antes de uma</tspan><tspan x="825" dy="20">linha do novo front-end</tspan></text><circle cx="1050" cy="340" r="26" fill="#0a0a0a" stroke="#1E8FD5" stroke-width="1.5"/><text x="1050" y="345" class="mono" font-size="13" fill="#1E8FD5" text-anchor="middle">05</text><text x="1050" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="1050" dy="0">Testar com</tspan><tspan x="1050" dy="28">quem usa</tspan></text><text x="1050" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="1050" dy="0">teste de usabilidade,</tspan><tspan x="1050" dy="20">ajuste e novo teste,</tspan><tspan x="1050" dy="20">até fechar</tspan></text><path d="M1036,316 C 980,262 895,262 841,316" fill="none" stroke="#1E8FD5" stroke-width="1.5" marker-end="url(#arra)"/><text x="937.5" y="256" class="cap" font-size="11" fill="#1E8FD5" text-anchor="middle">ciclos</text><rect x="100" y="560" width="1000" height="160" fill="#101010" stroke="#232323" stroke-width="1"/><text x="140" y="602" class="mono" font-size="13" fill="#1E8FD5">Um ano no projeto</text><text x="1060" y="602" class="cap" font-size="12" fill="#8c8c92" text-anchor="end">Saúde regulada deixa pouco espaço para adivinhação</text><rect x="140" y="628" width="72" height="40" fill="#1E8FD5" stroke="#1E8FD5" stroke-width="1"/><text x="176" y="653" class="mono" font-size="12" fill="#0a0a0a" text-anchor="middle">01</text><rect x="216" y="628" width="72" height="40" fill="#1E8FD5" stroke="#1E8FD5" stroke-width="1"/><text x="252" y="653" class="mono" font-size="12" fill="#0a0a0a" text-anchor="middle">02</text><rect x="292" y="628" width="72" height="40" fill="#1E8FD5" stroke="#1E8FD5" stroke-width="1"/><text x="328" y="653" class="mono" font-size="12" fill="#0a0a0a" text-anchor="middle">03</text><rect x="368" y="628" width="72" height="40" fill="#1E8FD5" stroke="#1E8FD5" stroke-width="1"/><text x="404" y="653" class="mono" font-size="12" fill="#0a0a0a" text-anchor="middle">04</text><rect x="444" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="480" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">05</text><rect x="520" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="556" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">06</text><rect x="596" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="632" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">07</text><rect x="672" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="708" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">08</text><rect x="748" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="784" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">09</text><rect x="824" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="860" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">10</text><rect x="900" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="936" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">11</text><rect x="976" y="628" width="72" height="40" fill="#161616" stroke="#3a3a3a" stroke-width="1"/><text x="1012" y="653" class="mono" font-size="12" fill="#5a5a60" text-anchor="middle">12</text><text x="140" y="698" class="cap" font-size="12" fill="#ededed">4 meses in loco em Miami</text><text x="444" y="698" class="cap" font-size="12" fill="#8c8c92">8 meses remoto, em ciclos com o time</text></svg>