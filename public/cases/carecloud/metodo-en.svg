<text x="40" y="52" class="mono" font-size="14" fill="#8c8c92">05 — The method</text><text x="1160" y="52" class="mono" font-size="14" fill="#8c8c92" text-anchor="end">4 months on-site · ~1 year on the project</text><path d="M40,78 H1160" stroke="#232323" stroke-width="1"/><path d="M150,340 H1050" stroke="#3a3a3a" stroke-width="1"/><circle cx="150" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="150" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">01</text><text x="150" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="150" dy="0">Observe</tspan><tspan x="150" dy="28">up close</tspan></text><text x="150" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="150" dy="0">nurses, front desk,</tspan><tspan x="150" dy="20">billers and the doctor</tspan><tspan x="150" dy="20">between two rooms</tspan></text><circle cx="375" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="375" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">02</text><text x="375" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="375" dy="0">Interview</tspan><tspan x="375" dy="28">clinicians</tspan></text><text x="375" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="375" dy="0">doctors, nurses and</tspan><tspan x="375" dy="20">front-desk staff, at the</tspan><tspan x="375" dy="20">CareCloud office in Miami</tspan></text><circle cx="600" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="600" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">03</text><text x="600" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="600" dy="0">Map the</tspan><tspan x="600" dy="28">workflows</tspan></text><text x="600" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="600" dy="0">intake, history, exam,</tspan><tspan x="600" dy="20">plan, prescribing</tspan><tspan x="600" dy="20">and billing</tspan></text><circle cx="825" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="825" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">04</text><text x="825" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="825" dy="0">Hi-fi</tspan><tspan x="825" dy="28">prototype</tspan></text><text x="825" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="825" dy="0">Sketch and Axure, clickable</tspan><tspan x="825" dy="20">screens, before a line</tspan><tspan x="825" dy="20">of the new front-end</tspan></text><circle cx="1050" cy="340" r="26" fill="#0a0a0a" stroke="#1E8FD5" stroke-width="1.5"/><text x="1050" y="345" class="mono" font-size="13" fill="#1E8FD5" text-anchor="middle">05</text><text x="1050" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="1050" dy="0">Test with</tspan><tspan x="1050" dy="28">the users</tspan></text><text x="1050" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="1050" dy="0">usability test,</tspan><tspan x="1050" dy="20">adjust and test again,</tspan><tspan x="1050" dy="20">until it holds</tspan></text><path d="M1036,316 C 980,262 895,262 841,316" fill="none" stroke="#1E8FD5" stroke-width="1.5" marker-end="url(#arra)"/><text x="937.5" y="256" class="cap" font-size="11" fill="#1E8FD5" text-anchor="middle">cycles</text><rect x="100" y="560" width="1000" height="160" fill="#101010" stroke="#232323" stroke-width="1"/><text x="140" y="602" class="mono" font-size="13" fill="#1E8FD5">One year on the project</text><text x="1060" y="602" class="cap" font-size="12" fill="#8c8c92" text-anchor="end">Regulated healthcare leaves little room for guessing</text><rect x="140" y="628" width="72" height="40" fill="#1E8FD5" stroke="#1E8FD5" stroke-width="1"/><text x="176" y="653" class="mono" fon