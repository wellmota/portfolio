<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agenda do campo · GolfHub ERP</title>
    <link rel="icon" href="../app/assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=DM+Sans:wght@400;700&display=swap" />
    <link rel="stylesheet" href="assets/erp.css" />
    <script src="../app/assets/icons.js"></script>
    <script src="../app/assets/data.js"></script>
    <script src="assets/erp.js"></script>
    <style>
      /* Inferred from the deck modules "Reserva online", "Auto check-in", "Reservas": the tee sheet.
         Rows every 10 min (range: 30 min) × 4 slots; drag a booking to move it; check-in per player. */
      .ph {
        margin-bottom: 18px;
      }
      .days {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        margin-bottom: 18px;
      }
      .days__list {
        display: flex;
        gap: 6px;
        flex: 1;
        min-width: 0;
      }
      .day {
        position: relative;
        flex: 1;
        min-width: 0;
        max-width: 92px;
        height: 56px;
        border-radius: 12px;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 1px;
        color: var(--ink-2);
        transition:
          background 0.25s,
          color 0.25s,
          transform 0.35s var(--spring),
          box-shadow 0.3s;
      }
      .day:hover {
        background: var(--canvas);
        transform: translateY(-2px);
      }
      .day small {
        font-size: 12px;
        color: var(--ink-3);
        transition: color 0.25s;
      }
      .day b {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.15;
      }
      .day__occ {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 6px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .day__occ i {
        display: block;
        height: 100%;
        width: calc(var(--o) * 1%);
        background: var(--mint);
        border-radius: inherit;
      }
      .day[aria-pressed='true'] {
        background: var(--indigo);
        color: #fff;
        box-shadow: 0 12px 22px -12px rgba(74, 58, 255, 0.9);
      }
      .day[aria-pressed='true'] small {
        color: #dcd8ff;
      }
      .day[aria-pressed='true'] .day__occ {
        background: rgba(255, 255, 255, 0.25);
      }
      .day[aria-pressed='true'] .day__occ i {
        background: #fff;
      }
      .day.is-today::before {
        content: '';
        position: absolute;
        top: 7px;
        right: 9px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--coral);
      }
      .wx {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-left: 16px;
        border-left: 1px solid var(--line);
        font-size: 13px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .wx b {
        display: block;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
      }
      .wx .i {
        width: 30px;
        height: 30px;
        color: var(--orange);
      }

      .ag {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: var(--gap);
        align-items: start;
      }
      .sheet {
        display: flex;
        flex-direction: column;
        height: max(460px, calc(100vh - var(--top) - 236px));
        overflow: hidden;
      }
      .sheet__h {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .stat b {
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
      }
      .stat .i {
        width: 18px;
        height: 18px;
      }
      .stat__ring {
        width: 34px;
        height: 34px;
        transform: rotate(-90deg);
      }
      .sheet__hint {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-3);
      }
      .sheet__hint .i {
        width: 16px;
        height: 16px;
      }
      .cols,
      .tr {
        display: grid;
        grid-template-columns: 58px repeat(4, minmax(0, 1fr)) 46px 112px;
        gap: 6px;
        padding: 0 14px;
        align-items: center;
      }
      .cols {
        height: 36px;
        font-size: 12px;
        color: var(--ink-3);
        font-weight: 500;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .scroll {
        position: relative;
        flex: 1;
        overflow: auto;
        overscroll-behavior: contain;
        scroll-behavior: smooth;
      }
      .tr {
        position: relative;
        height: 52px;
        border-bottom: 1px solid var(--line);
        transition: background 0.2s;
      }
      .tr.is-past .tr__t {
        color: var(--ink-3);
        font-weight: 500;
      }
      .tr__t {
        font-weight: 600;
        font-size: 13.5px;
        font-variant-numeric: tabular-nums;
      }
      .tr.is-target {
        background: var(--indigo-50);
        box-shadow: inset 0 0 0 2px var(--indigo);
        border-radius: 10px;
      }
      .tr.is-invalid {
        background: #fff6f7;
      }
      .tr.is-sel {
        background: #faf9ff;
      }
      .tr.is-sel::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--indigo);
      }
      .bk {
        display: flex;
        gap: 6px;
        height: 40px;
        border-radius: 10px;
        text-align: left;
        cursor: grab;
        touch-action: none;
        transition:
          transform 0.35s var(--spring),
          box-shadow 0.3s,
          opacity 0.2s;
      }
      .bk:hover .chip {
        box-shadow: 0 6px 14px -8px rgba(23, 22, 29, 0.35);
      }
      .bk:hover {
        transform: translateY(-1px);
      }
      .bk[data-locked] {
        cursor: pointer;
      }
      .bk.is-sel .chip {
        box-shadow: 0 0 0 2px var(--indigo);
      }
      .bk.is-lifted {
        opacity: 0.25;
      }
      .chip {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px 0 5px;
        border-radius: 10px;
        background: var(--tint, var(--field));
        transition:
          background 0.35s,
          box-shadow 0.3s;
      }
      .chip__t {
        min-width: 0;
        line-height: 1.2;
      }
      .chip__t b {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip__t small {
        display: block;
        font-size: 11px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip .av {
        position: relative;
      }
      .chip.is-in .av::after {
        content: '';
      }
      .chip__av {
        position: relative;
        flex: none;
        display: flex;
      }
      .chip__ck {
        position: absolute;
        right: -4px;
        bottom: -3px;
        box-shadow: 0 0 0 2px var(--tint, #fff);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ok);
        color: #fff;
        display: grid;
        place-items: center;
        animation: pop-in 0.45s var(--spring) both;
      }
      .chip__ck svg {
        width: 9px;
        height: 9px;
      }
      .t-chegou {
        --tint: #e8f7ef;
      }
      .t-parcial {
        --tint: #e9f5fc;
      }
      .t-aguardando {
        --tint: var(--indigo-50);
      }
      .t-noshow {
        --tint: #fdeff1;
      }
      .t-noshow .chip__t b {
        text-decoration: line-through;
        text-decoration-color: rgba(190, 38, 57, 0.5);
      }
      .t-confirmada {
        --tint: var(--field);
      }
      .free {
        height: 40px;
        border-radius: 10px;
        border: 1.5px dashed var(--line-2);
        color: var(--ink-4);
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
      }
      .free .i {
        width: 14px;
        height: 14px;
      }
      button.free {
        color: var(--ink-3);
      }
      button.free:hover {
        border-color: var(--indigo);
        color: var(--indigo);
        background: var(--indigo-50);
      }
      .free--past {
        border-style: solid;
        border-color: var(--line);
        background: repeating-linear-gradient(135deg, #fafafa 0 6px, #f4f4f6 6px 7px);
      }
      .blk {
        grid-column: 2 / span 6;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        font-size: 12.5px;
        color: #6b4a00;
        background: repeating-linear-gradient(135deg, #fff6e6 0 10px, #fdeccd 10px 20px);
      }
      .blk b {
        font-weight: 600;
      }
      .blk .i {
        width: 16px;
        height: 16px;
      }
      .cart {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-2);
      }
      .cart .i {
        width: 18px;
        height: 18px;
        color: var(--ink-3);
      }
      .cart.is-none {
        color: var(--ink-4);
        font-weight: 400;
      }
      .tr .badge {
        justify-self: start;
      }
      .badge small {
        font-weight: 400;
        opacity: 0.85;
      }
      /* now line */
      .now {
        position: absolute;
        left: 0;
        right: 0;
        height: 0;
        z-index: 4;
        pointer-events: none;
        transition: top 1s linear;
      }
      .now::before {
        content: '';
        position: absolute;
        left: 62px;
        right: 10px;
        top: -1px;
        height: 2px;
        background: linear-gradient(90deg, var(--coral), rgba(240, 71, 90, 0.15));
      }
      .now__pill {
        position: absolute;
        left: 8px;
        top: -11px;
        height: 22px;
        padding: 0 7px;
        border-radius: 7px;
        background: var(--coral);
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
        display: flex;
        align-items: center;
        font-variant-numeric: tabular-nums;
        box-shadow: 0 6px 12px -6px rgba(240, 71, 90, 0.8);
      }
      .now__dot {
        position: absolute;
        left: 58px;
        top: -5px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--coral);
        box-shadow: 0 0 0 0 rgba(240, 71, 90, 0.5);
        animation: ping-r 1.8s infinite;
      }
      @keyframes ping-r {
        70% {
          box-shadow: 0 0 0 9px rgba(240, 71, 90, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(240, 71, 90, 0);
        }
      }
      /* drag ghost */
      .ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 70;
        pointer-events: none;
        display: flex;
        gap: 6px;
        border-radius: 12px;
        padding: 6px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow:
          0 30px 50px -18px rgba(44, 31, 181, 0.45),
          0 0 0 2px var(--indigo);
        backdrop-filter: blur(6px);
        transition: rotate 0.25s var(--spring), scale 0.25s var(--spring);
        rotate: -1.5deg;
        scale: 1.03;
      }
      .ghost .chip {
        height: 40px;
      }
      .ghost__lbl {
        position: absolute;
        right: -8px;
        top: -14px;
        background: var(--indigo);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        border-radius: 8px;
        padding: 3px 8px;
        box-shadow: 0 8px 16px -8px rgba(74, 58, 255, 0.9);
        font-variant-numeric: tabular-nums;
      }
      .ghost.is-bad {
        box-shadow:
          0 30px 50px -18px rgba(190, 38, 57, 0.4),
          0 0 0 2px var(--coral);
      }
      .ghost.is-bad .ghost__lbl {
        background: var(--coral);
      }

      /* detail panel */
      .det {
        padding: 20px;
        height: max(460px, calc(100vh - var(--top) - 236px));
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .det__in {
        display: flex;
        flex-direction: column;
        height: 100%;
        animation: rise 0.45s var(--ease) both;
      }
      .det.is-quiet .det__in {
        animation: none;
      }
      .det__h {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .det__code {
        font-size: 12px;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .det__time {
        margin-top: 12px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .det__sub {
        color: var(--ink-3);
        font-size: 13px;
        margin-top: 2px;
      }
      .det__sec {
        margin-top: 18px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        display: flex;
        justify-content: space-between;
      }
      .pl {
        margin-top: 8px;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2px;
      }
      .pl li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
      }
      .pl__t {
        flex: 1;
        min-width: 0;
      }
      .pl__t b {
        display: block;
        font-weight: 500;
        font-size: 13.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pl__t small {
        display: block;
        font-size: 12px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      a.pl__t:hover b {
        color: var(--indigo);
      }
      /* check-in switch */
      .sw {
        position: relative;
        width: 46px;
        height: 28px;
        border-radius: 28px;
        background: #e3e2e9;
        flex: none;
        transition: background 0.3s var(--ease);
      }
      .sw::before {
        content: '';
        position: absolute;
        inset: -8px -2px;
      }
      .sw__k {
        position: absolute;
        left: 3px;
        top: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(23, 22, 29, 0.2);
        display: grid;
        place-items: center;
        transition: transform 0.45s var(--spring);
      }
      .sw__k svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: var(--ok);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
        transition: stroke-dashoffset 0.35s var(--ease) 0.12s;
      }
      .sw[aria-checked='true'] {
        background: var(--ok);
      }
      .sw[aria-checked='true'] .sw__k {
        transform: translateX(18px);
      }
      .sw[aria-checked='true'] .sw__k svg {
        stroke-dashoffset: 0;
      }
      .sw[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .facts {
        margin-top: 14px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
        padding: 14px;
        border-radius: 12px;
        background: var(--canvas);
      }
      .facts dt {
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .facts dd {
        font-size: 13px;
        font-weight: 500;
      }
      .det__act {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding-top: 14px;
      }
      .det__act .btn--primary {
        grid-column: 1 / -1;
      }
      .det__hint {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--ink-3);
      }
      .det__hint .i {
        width: 15px;
        height: 15px;
      }
      .moves {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 146px;
        z-index: 5;
        background: #fff;
        border-radius: 14px;
        box-shadow: var(--shadow-pop);
        padding: 10px;
        transform-origin: 50% 100%;
        animation: rise 0.35s var(--spring) both;
      }
      .moves p {
        font-size: 12.5px;
        color: var(--ink-3);
        padding: 4px 6px 8px;
      }
      .moves__grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .moves__grid button {
        height: 36px;
        border-radius: 9px;
        background: var(--canvas);
        font-weight: 600;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .moves__grid button:hover {
        background: var(--indigo);
        color: #fff;
      }
      .empty {
        margin: auto;
        text-align: center;
        max-width: 240px;
        color: var(--ink-3);
      }
      .empty .i {
        width: 44px;
        height: 44px;
        color: var(--indigo);
        margin-bottom: 10px;
      }
      .empty b {
        display: block;
        color: var(--ink);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .blk-det {
        margin-top: 16px;
        padding: 14px;
        border-radius: 12px;
        background: repeating-linear-gradient(135deg, #fff6e6 0 10px, #fdeccd 10px 20px);
        color: #6b4a00;
      }
      .fade-swap {
        animation: rise 0.45s var(--ease) both;
      }

      @media (max-width: 1360px) {
        .ag {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        .cols,
        .tr {
          grid-template-columns: 52px repeat(4, minmax(0, 1fr)) 40px 110px;
          gap: 5px;
          padding: 0 10px;
        }
        .chip .av {
          display: none;
        }
        .chip {
          position: relative;
          padding-left: 9px;
        }
        /* no avatar: the tick becomes a corner badge on the chip */
        .chip__av {
          position: absolute;
          top: -4px;
          right: -4px;
        }
        .chip__ck {
          position: static;
        }
        .wx span:last-child {
          display: none;
        }
        .stat--opt {
          display: none;
        }
        .sheet__hint span {
          display: none;
        }
      }
      @media (max-width: 1200px) {
        .ag {
          grid-template-columns: minmax(0, 1fr) 280px;
        }
        .sheet__h {
          gap: 14px;
        }
        .stat__ring,
        .stat--opt2 {
          display: none;
        }
      }
    </style>
  </head>
  <body data-page="agenda">
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <div class="shell">
      <aside class="side" data-side></aside>
      <script>
        ERP.side(document.querySelector('[data-side]'));
      </script>
      <div class="frame">
        <header class="top" data-top></header>
        <script>
          ERP.top(document.querySelector('[data-top]'));
        </script>
        <main class="main" id="main" tabindex="-1">
          <div class="ph rise" style="--d: 0">
            <div>
              <h1>Agenda do campo</h1>
              <p id="sub"></p>
            </div>
            <div class="ph__act">
              <div class="seg" role="tablist" aria-label="Campo" id="tabs"><span class="seg__pill" aria-hidden="true"></span></div>
              <button type="button" class="btn btn--primary" data-soon="Nova reserva"><span data-i="add"></span>Nova reserva</button>
            </div>
          </div>

          <section class="card days rise" style="--d: 1" aria-label="Data">
            <button type="button" class="icon-btn" id="prev" aria-label="Semana anterior"><span data-i="arrow-left-2"></span></button>
            <div class="days__list" id="days"></div>
            <button type="button" class="icon-btn" id="next" aria-label="Próxima semana"><span data-i="arrow-right-2"></span></button>
            <div class="wx" id="wx"></div>
          </section>

          <div class="ag">
            <section class="card sheet rise" style="--d: 2" aria-labelledby="sheet-t">
              <h2 class="sr-only" id="sheet-t">Horários de saída</h2>
              <div class="sheet__h" id="stats"></div>
              <div class="cols" aria-hidden="true" id="cols"></div>
              <div class="scroll" id="scroll"><ol id="rows"></ol><div class="now" id="now" hidden><span class="now__pill" id="now-t"></span><span class="now__dot"></span></div></div>
            </section>
            <aside class="card det rise" style="--d: 3" aria-label="Detalhes da reserva" id="det" aria-live="polite"></aside>
          </div>
        </main>
      </div>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="dialog" id="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d" hidden tabindex="-1">
      <h2 id="dlg-t">Cancelar reserva?</h2>
      <p id="dlg-d"></p>
      <div class="dialog__act">
        <button type="button" class="btn btn--ghost" data-close data-autofocus>Manter</button>
        <button type="button" class="btn btn--primary" id="dlg-ok" style="background: var(--bad); box-shadow: none">Cancelar reserva</button>
      </div>
    </div>

    <script>
      (() => {
        const F = ERP.fmt;
        const $ = (s) => document.querySelector(s);
        const I = (n, c = '') => ERP.icon(n, c);
        document.querySelectorAll('[data-i]').forEach((el) => (el.outerHTML = I(el.dataset.i)));
        const qs = ERP.qs;

        /* ---------- state ---------- */
        const st = {
          course: ['a', 'b', 'range'].includes(qs.get('campo')) ? qs.get('campo') : 'a',
          date: /^\d{4}-\d{2}-\d{2}$/.test(qs.get('data') || '') ? ERP.dateFromKey(qs.get('data')) : new Date(ERP.today),
          sel: qs.get('id'),
          weekOff: 0,
        };
        const sheet = () => ERP.sheet(st.date, st.course);
        const dd = () => ERP.dayDiff(st.date);
        const isToday = () => dd() === 0;
        const findRow = (id) => sheet().rows.find((r) => r.bk && r.bk.id === id);
        const movable = (bk) => ['aguardando', 'confirmada'].includes(ERP.status(bk, dd()));
        const future = (row) => dd() > 0 || (dd() === 0 && row.m > ERP.clockMins);
        const syncUrl = () => {
          const u = new URLSearchParams();
          if (st.course !== 'a') u.set('campo', st.course);
          if (dd() !== 0) u.set('data', F.iso(st.date));
          if (st.sel) u.set('id', st.sel);
          history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : ''));
        };

        /* ---------- course tabs (segmented, sliding pill) ---------- */
        const tabs = $('#tabs');
        tabs.insertAdjacentHTML(
          'beforeend',
          Object.values(ERP.courseMeta)
            .map((c) => `<button type="button" role="tab" id="tab-${c.id}" aria-controls="rows" data-c="${c.id}">${c.id === 'range' ? 'Range' : c.name}</button>`)
            .join(''),
        );
        const pill = tabs.querySelector('.seg__pill');
        const paintTabs = () => {
          tabs.querySelectorAll('[role=tab]').forEach((b) => {
            const on = b.dataset.c === st.course;
            b.setAttribute('aria-selected', on);
            b.tabIndex = on ? 0 : -1;
            if (on) {
              pill.style.width = b.offsetWidth + 'px';
              pill.style.transform = `translateX(${b.offsetLeft}px)`;
            }
          });
        };
        tabs.addEventListener('click', (e) => {
          const b = e.target.closest('[role=tab]');
          if (!b || b.dataset.c === st.course) return;
          st.course = b.dataset.c;
          st.sel = null;
          paintTabs();
          renderAll(true);
        });
        tabs.addEventListener('keydown', (e) => {
          if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
          const all = [...tabs.querySelectorAll('[role=tab]')];
          const i = all.findIndex((b) => b.dataset.c === st.course);
          const n = all[(i + (e.key === 'ArrowRight' ? 1 : all.length - 1)) % all.length];
          n.focus();
          n.click();
        });

        /* ---------- date strip ---------- */
        const occ = (date, c) => {
          const s = ERP.sheet(date, c);
          const open = s.rows.filter((r) => !r.block).length * 4;
          const used = s.rows.reduce((a, r) => a + (r.bk ? r.bk.players.length : 0), 0);
          return Math.round((used / open) * 100);
        };
        const renderDays = () => {
          const base = new Date(ERP.today);
          base.setDate(base.getDate() - 1 + st.weekOff * 7);
          const days = Array.from({ length: 9 }, (_, i) => {
            const d = new Date(base);
            d.setDate(d.getDate() + i);
            return d;
          });
          $('#days').innerHTML = days
            .map((d) => {
              const on = F.iso(d) === F.iso(st.date);
              const o = occ(d, st.course);
              const lbl = ERP.dayDiff(d) === 0 ? 'Hoje' : F.wd(d);
              return `<button type="button" class="day${ERP.dayDiff(d) === 0 ? ' is-today' : ''}" aria-pressed="${on}" data-d="${F.iso(d)}" aria-label="${F.full(d)}, ${o}% ocupado">
                <small>${lbl}</small><b>${d.getDate()}</b><span class="day__occ" aria-hidden="true"><i style="--o:${o}"></i></span></button>`;
            })
            .join('');
        };
        $('#days').addEventListener('click', (e) => {
          const b = e.target.closest('.day');
          if (!b) return;
          st.date = ERP.dateFromKey(b.dataset.d);
          st.sel = null;
          renderAll(true);
        });
        $('#prev').addEventListener('click', () => (st.weekOff--, renderDays()));
        $('#next').addEventListener('click', () => (st.weekOff++, renderDays()));
        const w = GH.club.weather;
        $('#wx').innerHTML = `${I('sun-1')}<span><b>${F.num(w.temp, 1)} °C</b>${w.sky}</span><span>Vento ${w.wind} km/h ${w.windDir}<br/>Umidade ${w.humidity}%</span>`;

        /* ---------- tee sheet ---------- */
        const cols = () => {
          const m = ERP.courseMeta[st.course];
          $('#cols').innerHTML = `<span>Horário</span>${[1, 2, 3, 4].map((n) => `<span>${m.unit} ${n}</span>`).join('')}<span>${st.course === 'range' ? 'Baldes' : 'Carro'}</span><span>Status</span>`;
        };
        const chip = (p, s) => {
          const sub = p.guest ? ERP.convidado(p) : st.course === 'range' ? `Baia ${p.baia}` : p.hcp != null ? `HCP ${F.hcp(p.hcp)}` : 'Sem HCP';
          const ck = p.checkin ? `<span class="chip__ck" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>` : '';
          return `<span class="chip${p.checkin ? ' is-in' : ''}"><span class="chip__av">${ERP.avatar(p, 26)}${ck}</span><span class="chip__t"><b>${ERP.esc(ERP.short(p))}</b><small>${sub}</small></span></span>`;
        };
        const statusBadge = (bk) => {
          const s = ERP.status(bk, dd());
          const m = ERP.statusMeta[s];
          const c = bk.players.filter((p) => p.checkin).length;
          const extra = s === 'chegou' ? `<small>${bk.players.map((p) => p.checkin).sort().slice(-1)[0]}</small>` : s === 'parcial' ? `<small>${c}/${bk.players.length}</small>` : '';
          return `<span class="badge badge--${m.cls}" data-badge="${bk.id}">${I(m.icon)}${s === 'parcial' ? 'Chegando' : m.label}${extra ? ' ' + extra : ''}</span>`;
        };
        const rowHtml = (row, i) => {
          const past = !future(row) && dd() <= 0;
          const sel = row.bk && row.bk.id === st.sel;
          let mid = '';
          if (row.block) {
            mid = `<span class="blk">${I('lock')}<b>${row.block.title}</b> · ${row.block.note}</span>`;
          } else {
            const bk = row.bk;
            const n = bk ? bk.players.length : 0;
            if (bk) {
              const s = ERP.status(bk, dd());
              const names = bk.players.map((p) => p.name + (p.guest ? ` (${ERP.convidado(p).toLowerCase()})` : '')).join(', ');
              mid += `<button type="button" class="bk t-${s}${sel ? ' is-sel' : ''}" style="grid-column: 2 / span ${n}" data-id="${bk.id}" ${movable(bk) ? '' : 'data-locked'} aria-pressed="${sel}"
                aria-label="${row.t}, ${n} ${n === 1 ? 'jogador' : 'jogadores'}: ${ERP.esc(names)}. ${ERP.statusMeta[s].label}.${movable(bk) ? ' Arraste para mudar o horário.' : ''}">${bk.players.map((p) => chip(p, s)).join('')}</button>`;
            }
            for (let k = n; k < 4; k++)
              mid += past ? `<span class="free free--past" aria-hidden="true"></span>` : `<button type="button" class="free" data-t="${row.t}" data-k="${k + 1}" aria-label="Reservar ${row.t}, ${ERP.courseMeta[st.course].unit.toLowerCase()} ${k + 1}">${I('add')}<span>Livre</span></button>`;
            const units = st.course === 'range' ? (bk ? bk.balls : 0) : bk ? bk.cart : 0;
            mid += `<span class="cart${units ? '' : ' is-none'}">${units ? I(st.course === 'range' ? 'shopping-bag' : 'car') + units : '—'}</span>`;
            mid += bk ? statusBadge(bk) : '<span></span>';
          }
          return `<li class="tr${past ? ' is-past' : ''}${sel ? ' is-sel' : ''}${row.block ? ' is-block' : ''}" data-t="${row.t}" style="--i:${i}"><span class="tr__t">${row.t}</span>${mid}</li>`;
        };
        const rowsEl = $('#rows');
        const scrollEl = $('#scroll');
        const renderRows = () => {
          rowsEl.innerHTML = sheet().rows.map(rowHtml).join('');
          placeNow();
        };
        const ROW = 52;
        const firstVisibleIndex = () => Math.max(0, Math.floor(scrollEl.scrollTop / ROW));
        const renderStats = () => {
          const s = sheet();
          const open = s.rows.filter((r) => !r.block);
          const bks = open.filter((r) => r.bk).map((r) => r.bk);
          const used = bks.reduce((a, b) => a + b.players.length, 0);
          const o = Math.round((used / (open.length * 4)) * 100);
          const cnt = (k) => bks.filter((b) => ERP.status(b, dd()) === k).length;
          const carts = bks.reduce((a, b) => a + (st.course === 'range' ? b.balls : b.cart), 0);
          const C = 2 * Math.PI * 14;
          $('#stats').innerHTML = `
            <span class="stat"><svg class="stat__ring" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="#eff2f4" stroke-width="5"/><circle class="ring" cx="17" cy="17" r="14" fill="none" stroke="#52cd9f" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C * o) / 100} ${C}"/></svg><span><b>${o}%</b> ocupado</span></span>
            <span class="stat stat--opt2">${I('profile-2-user')}<span><b>${used}</b> ${st.course === 'range' ? 'reservas de baia' : 'jogadores'}</span></span>
            <span class="stat stat--opt">${I(st.course === 'range' ? 'shopping-bag' : 'car')}<span><b>${carts}</b> ${st.course === 'range' ? 'baldes' : 'carrinhos'}</span></span>
            ${dd() > 0 ? `<span class="stat">${I('calendar-tick')}<span><b>${bks.length}</b> confirmadas</span></span>` : `<span class="stat t-ok">${I('tick-circle')}<span><b>${cnt('chegou')}</b> chegaram</span></span>
            <span class="stat">${I('clock')}<span><b>${cnt('aguardando') + cnt('parcial')}</b> aguardando</span></span>
            <span class="stat t-bad">${I('close-circle')}<span><b>${cnt('noshow')}</b> no-show</span></span>`}`;
        };
        const placeNow = () => {
          const now = $('#now');
          if (!isToday()) return (now.hidden = true);
          const meta = ERP.courseMeta[st.course];
          const t = ERP.live();
          const m = t.getHours() * 60 + t.getMinutes() + t.getSeconds() / 60;
          const y = ((m - ERP.mins(meta.open)) / meta.step) * ROW;
          now.hidden = y < 0 || y > sheet().rows.length * ROW;
          now.style.top = y + 'px';
          $('#now-t').textContent = F.time(t);
        };
        setInterval(placeNow, 1000);

        /* ---------- detail panel ---------- */
        const det = $('#det');
        const plSub = (p) =>
          (p.guest ? `${ERP.convidado(p)} de ${ERP.first({ name: p.host })}` : `Sócio nº ${ERP.byId[p.id] ? ERP.byId[p.id].number : '—'} · HCP ${F.hcp(p.hcp)}`) +
          (p.checkin ? ` · chegou ${p.checkin}${p.via === 'app' ? ' pelo app' : ''}` : '');
        const ckLabel = (bk) => `${I('tick-circle')}${bk.players.every((p) => p.checkin) ? 'Todos fizeram check-in' : dd() === 0 ? 'Check-in manual de todos' : 'Check-in só no dia'}`;
        /* check-in changes patch the open panel in place (switch knob slides, badge morphs) instead of re-rendering it */
        const patchDet = (row) => {
          const bk = row.bk;
          const s = ERP.status(bk, dd());
          const m = ERP.statusMeta[s];
          const b = $('#det-badge');
          if (b) {
            b.className = `badge badge--${m.cls}`;
            b.innerHTML = `${I(m.icon)}${s === 'parcial' ? 'Chegando' : m.label}`;
            void b.offsetWidth;
            b.classList.add('is-bump');
          }
          bk.players.forEach((p, i) => {
            const sw = det.querySelector(`.sw[data-p="${i}"]`);
            if (!sw) return;
            sw.setAttribute('aria-checked', String(!!p.checkin));
            const sm = sw.closest('li').querySelector('.pl__t small');
            if (sm) sm.textContent = plSub(p);
          });
          const ck = $('#ck-all');
          if (ck) {
            ck.innerHTML = ckLabel(bk);
            ck.disabled = dd() !== 0 || bk.players.every((p) => p.checkin);
          }
          const mov = movable(bk);
          ['#mv', '#cx'].forEach((id) => $(id) && ($(id).disabled = !mov));
          const hint = det.querySelector('.det__hint');
          if (!mov && hint) hint.remove();
          if (mov && !hint) det.querySelector('.det__in').insertAdjacentHTML('beforeend', `<p class="det__hint">${I('drag')}Ou arraste a reserva na agenda</p>`);
        };
        /* the tee-sheet row is rebuilt; keep its selection */
        const reselect = (bk) => {
          const el = rowsEl.querySelector(`.bk[data-id="${bk.id}"]`);
          if (!el) return;
          el.classList.add('is-sel');
          el.setAttribute('aria-pressed', 'true');
          el.closest('.tr').classList.add('is-sel');
        };
        const renderDet = (quiet) => {
          det.classList.toggle('is-quiet', !!quiet);
          const row = st.sel && findRow(st.sel);
          if (!row) {
            det.innerHTML = `<div class="det__in"><div class="empty">${I('calendar-tick')}<b>Selecione uma reserva</b>Veja os jogadores, faça o check-in ou arraste a reserva para outro horário.</div></div>`;
            return;
          }
          const bk = row.bk;
          const s = ERP.status(bk, dd());
          const m = ERP.statusMeta[s];
          const meta = ERP.courseMeta[st.course];
          const allIn = bk.players.every((p) => p.checkin);
          const canCheck = dd() === 0;
          const guests = bk.players.filter((p) => p.guest).length;
          det.innerHTML = `<div class="det__in">
            <div class="det__h"><span class="badge badge--${m.cls}" id="det-badge">${I(m.icon)}${s === 'parcial' ? 'Chegando' : m.label}</span><span class="det__code">${bk.code}</span></div>
            <p class="det__time">${bk.t}</p>
            <p class="det__sub">${F.dayLabel(st.date)} · ${meta.name} · ${st.course === 'range' ? 'baias ' + bk.players.map((p) => p.baia).join(', ') : 'saída do tee 1'}</p>
            <p class="det__sec"><span>${st.course === 'range' ? 'Reservas' : 'Jogadores'} (${bk.players.length})</span><span>Check-in</span></p>
            <ul class="pl">${bk.players
              .map((p, i) => {
                const name = p.guest ? `<span class="pl__t"><b>${ERP.esc(p.name)}</b><small>${plSub(p)}</small></span>` : `<a class="pl__t" href="socios.html?id=${p.id}"><b>${ERP.esc(p.name)}</b><small>${plSub(p)}</small></a>`;
                return `<li>${ERP.avatar(p, 36)}${name}<button type="button" class="sw" role="switch" aria-checked="${!!p.checkin}" data-p="${i}" aria-label="Check-in de ${ERP.esc(p.name)}" ${canCheck ? '' : 'disabled'}><span class="sw__k"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></button></li>`;
              })
              .join('')}</ul>
            <dl class="facts">
              <div><dt>${st.course === 'range' ? 'Baldes' : 'Carrinho'}</dt><dd>${st.course === 'range' ? bk.balls + ' × 60 bolas' : bk.cart ? bk.cart + (bk.cart > 1 ? ' carrinhos' : ' carrinho') : 'Sem carrinho'}</dd></div>
              <div><dt>Pagamento</dt><dd>${ERP.methodName[bk.method]}</dd></div>
              <div><dt>Total</dt><dd>${bk.total ? F.brl(bk.total) : 'Sem custo (sócios)'}</dd></div>
              <div><dt>Canal</dt><dd>${bk.channel.replace('App GolfHub', 'App')} · ${F.ddmm(bk.created)}</dd></div>
            </dl>
            <div class="det__act">
              <button type="button" class="btn btn--primary" id="ck-all" ${!canCheck || allIn ? 'disabled' : ''}>${ckLabel(bk)}</button>
              <button type="button" class="btn btn--ghost" id="mv" ${movable(bk) ? '' : 'disabled'}>${I('arrow-swap-vertical')}Mover</button>
              <button type="button" class="btn btn--danger" id="cx" ${movable(bk) ? '' : 'disabled'}>${I('trash')}Cancelar</button>
            </div>${movable(bk) ? `<p class="det__hint">${I('drag')}Ou arraste a reserva na agenda</p>` : ''}</div>`;
        };
        const blockDet = (row) => {
          det.innerHTML = `<div class="det__in"><div class="det__h"><span class="badge badge--warn">${I('lock')}Bloqueado</span></div>
            <p class="det__time">${row.t}</p><p class="det__sub">${ERP.courseMeta[st.course].name} · ${F.dayLabel(st.date)}</p>
            <div class="blk-det"><b>${row.block.title}</b><br/>${row.block.note}. Horários de ${row.block.from} às ${row.block.to} fechados para reserva.</div>
            <div class="det__act"><button type="button" class="btn btn--ghost" data-soon="Liberar horário" style="grid-column:1/-1">${I('refresh-2')}Liberar horário</button></div></div>`;
        };

        const select = (id, scroll, quiet) => {
          st.sel = id;
          rowsEl.querySelectorAll('.tr.is-sel').forEach((el) => el.classList.remove('is-sel'));
          rowsEl.querySelectorAll('.bk.is-sel').forEach((el) => (el.classList.remove('is-sel'), el.setAttribute('aria-pressed', 'false')));
          const el = id && rowsEl.querySelector(`.bk[data-id="${id}"]`);
          if (el) {
            el.classList.add('is-sel');
            el.setAttribute('aria-pressed', 'true');
            el.closest('.tr').classList.add('is-sel');
            if (scroll) scrollEl.scrollTo({ top: el.closest('.tr').offsetTop - ROW * 3, behavior: ERP.reduced() ? 'auto' : 'smooth' });
          }
          renderDet(quiet);
          syncUrl();
        };
        const refreshRow = (row) => {
          const i = sheet().rows.indexOf(row);
          const el = rowsEl.querySelector(`.tr[data-t="${row.t}"]`);
          const tmp = document.createElement('ol');
          tmp.innerHTML = rowHtml(row, i);
          el.replaceWith(tmp.firstChild);
          return rowsEl.querySelector(`.tr[data-t="${row.t}"]`);
        };
        const bump = (id) => {
          const b = rowsEl.querySelector(`[data-badge="${id}"]`);
          b && b.classList.add('is-bump');
          const d = $('#det-badge');
          d && d.classList.add('is-bump');
        };

        /* clicks: select booking, free slot, check-in switches, actions */
        let suppress = false;
        rowsEl.addEventListener('click', (e) => {
          if (suppress) return (suppress = false);
          const bk = e.target.closest('.bk');
          if (bk) return select(bk.dataset.id);
          const fr = e.target.closest('button.free');
          if (fr) return ERP.toast(`Nova reserva às ${fr.dataset.t}: em breve`, { icon: 'info-circle' });
          const tr = e.target.closest('.tr.is-block');
          if (tr) {
            st.sel = null;
            select(null);
            blockDet(sheet().rows.find((r) => r.t === tr.dataset.t));
          }
        });
        det.addEventListener('click', (e) => {
          const row = st.sel && findRow(st.sel);
          if (!row) return;
          const bk = row.bk;
          const sw = e.target.closest('.sw');
          if (sw) {
            const p = bk.players[+sw.dataset.p];
            const on = sw.getAttribute('aria-checked') !== 'true';
            p.checkin = on ? F.time(ERP.live()) : null;
            p.via = 'recepcao';
            refreshRow(row);
            reselect(bk);
            patchDet(row);
            bump(bk.id);
            ERP.toast(on ? `${p.name}: check-in às ${p.checkin}` : `Check-in de ${ERP.first({ name: p.name })} desfeito`, { icon: on ? 'tick-circle' : 'refresh-2' });
            renderStats();
            const again = det.querySelector(`.sw[data-p="${sw.dataset.p}"]`);
            again && again.focus();
            return;
          }
          if (e.target.closest('#ck-all')) {
            const pend = bk.players.filter((p) => !p.checkin);
            const sws = [...det.querySelectorAll('.sw')].filter((s, i) => !bk.players[i].checkin);
            sws.forEach((s, k) => setTimeout(() => s.setAttribute('aria-checked', 'true'), ERP.reduced() ? 0 : k * 120));
            setTimeout(
              () => {
                const t = F.time(ERP.live());
                pend.forEach((p) => ((p.checkin = t), (p.via = 'recepcao')));
                refreshRow(row);
                reselect(bk);
                patchDet(row);
                bump(bk.id);
                renderStats();
                ERP.toast(`Check-in de ${pend.length} ${pend.length === 1 ? 'jogador' : 'jogadores'} às ${t}. Saída liberada no tee 1`);
              },
              ERP.reduced() ? 0 : pend.length * 120 + 380,
            );
            return;
          }
          if (e.target.closest('#mv')) return openMoves(bk);
          if (e.target.closest('#cx')) return askCancel(row);
          const mvb = e.target.closest('[data-move]');
          if (mvb) return moveTo(bk, sheet().rows.find((r) => r.t === mvb.dataset.move));
        });

        /* ---------- move (list + drag-and-drop) ---------- */
        const targets = () => sheet().rows.filter((r) => !r.block && !r.bk && future(r));
        const openMoves = (bk) => {
          const old = det.querySelector('.moves');
          if (old) return old.remove();
          const opts = targets().filter((r) => r.m >= ERP.mins(bk.t) - 60).slice(0, 12);
          det.insertAdjacentHTML(
            'beforeend',
            `<div class="moves" role="dialog" aria-label="Escolher novo horário"><p>Horários livres para ${bk.players.length} ${bk.players.length === 1 ? 'jogador' : 'jogadores'}</p><div class="moves__grid">${opts.map((r) => `<button type="button" data-move="${r.t}">${r.t}</button>`).join('')}</div></div>`,
          );
          det.querySelector('.moves button').focus();
        };
        const moveTo = (bk, target, fromRect) => {
          const from = findRow(bk.id);
          if (!target || !from || target === from) return;
          const oldT = bk.t;
          const oldTop = rowsEl.querySelector(`.tr[data-t="${oldT}"]`).offsetTop;
          from.bk = null;
          target.bk = bk;
          bk.t = target.t;
          refreshRow(from);
          const el = refreshRow(target).querySelector('.bk');
          select(bk.id);
          const rowEl = el.closest('.tr');
          if (!fromRect) {
            const b = scrollEl.getBoundingClientRect();
            const y = rowEl.getBoundingClientRect().top;
            if (y < b.top + ROW || y > b.bottom - ROW * 2) scrollEl.scrollTo({ top: rowEl.offsetTop - ROW * 3, behavior: 'auto' });
          }
          if (!ERP.reduced()) {
            const to = el.getBoundingClientRect();
            const fr = fromRect || { left: to.left, top: to.top + (oldTop - rowEl.offsetTop) };
            el.animate(
              [
                { transform: `translate(${fr.left - to.left}px, ${fr.top - to.top}px) scale(1.03) rotate(-1.5deg)`, boxShadow: '0 30px 50px -18px rgba(44,31,181,.45)' },
                { transform: 'none', boxShadow: '0 0 0 rgba(0,0,0,0)' },
              ],
              { duration: 520, easing: 'cubic-bezier(.34,1.45,.64,1)' },
            );
            rowEl.animate([{ background: '#e3e0ff' }, { background: 'transparent' }], { duration: 1400, easing: 'ease-out' });
          }
          ERP.toast(`Reserva movida de ${oldT} para ${target.t}. Jogadores avisados no app`, {
            icon: 'arrow-swap-vertical',
            action: { label: 'Desfazer', fn: () => moveTo(bk, sheet().rows.find((r) => r.t === oldT)) },
          });
          renderStats();
        };
        /* drag-and-drop with a ghost; drop animates into the new row */
        let drag = null;
        rowsEl.addEventListener('pointerdown', (e) => {
          const el = e.target.closest('.bk');
          if (!el || e.button !== 0) return;
          const row = findRow(el.dataset.id);
          drag = { el, row, bk: row.bk, x0: e.clientX, y0: e.clientY, on: false };
        });
        const endDrag = () => {
          if (!drag) return;
          drag.ghost && drag.ghost.remove();
          drag.el.classList.remove('is-lifted');
          rowsEl.querySelectorAll('.is-target,.is-invalid').forEach((x) => x.classList.remove('is-target', 'is-invalid'));
          document.body.style.cursor = '';
          cancelAnimationFrame(drag.raf);
          drag = null;
        };
        window.addEventListener('pointermove', (e) => {
          if (!drag) return;
          if (!drag.on) {
            if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
            if (!movable(drag.bk)) {
              ERP.toast('Só dá para mover reservas que ainda não saíram', { icon: 'info-circle' });
              drag = null;
              return;
            }
            drag.on = true;
            const r = drag.el.getBoundingClientRect();
            drag.dx = e.clientX - r.left;
            drag.dy = e.clientY - r.top;
            const g = document.createElement('div');
            g.className = 'ghost';
            g.style.width = r.width + 12 + 'px';
            g.innerHTML = drag.el.innerHTML + `<span class="ghost__lbl">${drag.bk.t}</span>`;
            document.body.appendChild(g);
            drag.ghost = g;
            drag.el.classList.add('is-lifted');
            document.body.style.cursor = 'grabbing';
            const auto = () => {
              if (!drag) return;
              const b = scrollEl.getBoundingClientRect();
              if (drag.y < b.top + 50) scrollEl.scrollTop -= 8;
              else if (drag.y > b.bottom - 50) scrollEl.scrollTop += 8;
              drag.raf = requestAnimationFrame(auto);
            };
            drag.raf = requestAnimationFrame(auto);
          }
          drag.y = e.clientY;
          drag.ghost.style.transform = `translate(${e.clientX - drag.dx - 6}px, ${e.clientY - drag.dy - 6}px)`;
          const tr = document.elementFromPoint(e.clientX, e.clientY);
          const rowEl = tr && tr.closest('#rows .tr');
          rowsEl.querySelectorAll('.is-target,.is-invalid').forEach((x) => x.classList.remove('is-target', 'is-invalid'));
          const lbl = drag.ghost.querySelector('.ghost__lbl');
          drag.target = null;
          if (rowEl) {
            const row = sheet().rows.find((r) => r.t === rowEl.dataset.t);
            const ok = row && !row.block && (!row.bk || row.bk === drag.bk) && future(row);
            rowEl.classList.add(ok ? 'is-target' : 'is-invalid');
            drag.ghost.classList.toggle('is-bad', !ok);
            lbl.textContent = ok ? `Soltar às ${row.t}` : row.block ? 'Bloqueado' : !future(row) ? 'Horário passou' : 'Ocupado';
            if (ok && row.bk !== drag.bk) drag.target = row;
          }
        });
        window.addEventListener('pointerup', () => {
          if (!drag) return;
          if (!drag.on) return (drag = null);
          suppress = true;
          setTimeout(() => (suppress = false), 50);
          const { bk, target, ghost } = drag;
          const rect = ghost.getBoundingClientRect();
          endDrag();
          if (target) moveTo(bk, target, { left: rect.left + 6, top: rect.top + 6 });
        });
        window.addEventListener('keydown', (e) => e.key === 'Escape' && drag && endDrag());

        /* ---------- cancel ---------- */
        const dlg = $('#dlg');
        const ov = ERP.overlay(dlg, $('#scrim'));
        let pending = null;
        const askCancel = (row) => {
          pending = row;
          $('#dlg-d').textContent = `${row.t} no ${ERP.courseMeta[st.course].name}, ${row.bk.players.map((p) => ERP.first({ name: p.name })).join(', ')}. Os jogadores recebem o aviso no app e a vaga volta para a agenda.`;
          ov.open();
        };
        $('#dlg-ok').addEventListener('click', () => {
          const row = pending;
          if (!row) return;
          ov.close();
          const bk = row.bk;
          const el = rowsEl.querySelector(`.bk[data-id="${bk.id}"]`);
          const done = () => {
            row.bk = null;
            refreshRow(row);
            st.sel = null;
            renderDet();
            syncUrl();
            renderStats();
            ERP.toast(`Reserva das ${row.t} cancelada`, { icon: 'trash', action: { label: 'Desfazer', fn: () => ((row.bk = bk), refreshRow(row), select(bk.id), renderStats()) } });
          };
          if (ERP.reduced() || !el) return done();
          el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.92) translateX(12px)' }], { duration: 320, easing: 'ease-in' }).onfinish = done;
        });

        /* ---------- render ---------- */
        const renderAll = (animate) => {
          renderDays();
          paintTabs();
          cols();
          renderStats();
          $('#sub').textContent = `${F.full(st.date)} · ${ERP.courseMeta[st.course].name}, ${ERP.courseMeta[st.course].sub}`;
          if (!st.sel || !findRow(st.sel)) {
            const s = sheet();
            const pick = isToday() ? s.rows.find((r) => r.bk && ERP.status(r.bk, 0) === 'aguardando' && r.m > ERP.clockMins) : s.rows.find((r) => r.bk);
            st.sel = pick ? pick.bk.id : null;
          }
          renderRows(false);
          const selRow = st.sel && rowsEl.querySelector(`.bk[data-id="${st.sel}"]`);
          const nowTop = isToday() ? ((ERP.clockMins - ERP.mins(ERP.courseMeta[st.course].open)) / ERP.courseMeta[st.course].step) * ROW : Infinity;
          const anchor = Math.min(selRow ? selRow.closest('.tr').offsetTop : 0, nowTop) - ROW * 2;
          scrollEl.style.scrollBehavior = 'auto';
          scrollEl.scrollTop = Math.max(0, anchor);
          scrollEl.style.scrollBehavior = '';
          if (animate && !ERP.reduced()) {
            const first = firstVisibleIndex();
            rowsEl.querySelectorAll('.tr').forEach((el, i) => {
              const k = i - first;
              if (k >= 0 && k < 14) {
                el.style.setProperty('--i', k + 3);
                el.classList.add('row-in');
              }
            });
          }
          select(st.sel);
        };
        renderAll(true);
        requestAnimationFrame(paintTabs);
        document.fonts && document.fonts.ready.then(paintTabs);
      })();
    </script>
  </body>
</html>
