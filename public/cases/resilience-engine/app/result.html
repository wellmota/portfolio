<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcddec" />
    <title>Red Flags · Resilience Dynamic</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/app.css" />
    <style>
      /* Figma: notification pop-up / completed (848:17217 Productivity, 848:17248 Wellbeing).
         Pink header with close, woman-with-flag + Data Insights card, Productivity | Wellbeing tabs,
         flag rows, Suggested Tools. Added on top: today's river level (the "Track results" placeholder). */
      .rf {
        background: var(--surface);
      }

      /* ---------- Pink header ---------- */
      .rf-hero {
        background: var(--pink-light);
      }
      .rf-top {
        display: flex;
        justify-content: flex-end;
        padding: 4px 32px 0;
      }
      .rf-close img {
        width: 24px;
        height: 24px;
      }

      /* Today's level (the one addition): same river as Home, on a white card like Data Insights */
      .rf-level {
        display: grid;
        grid-template-columns: 1fr 128px;
        align-items: center;
        gap: 16px;
        margin: 12px var(--gutter) 0;
        padding: 16px;
        border-radius: var(--r-lg);
        background: var(--surface);
        box-shadow: 0 15px 40px #f1b5d2;
      }
      .rf-level__label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-3);
      }
      .rf-level__num {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 2px 0 10px;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: var(--deep);
      }
      .rf-level__of {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink-3);
      }
      .rf-level .river {
        height: 112px;
      }

      /* Title block: 22px Bold + Body Text 3, centred (Figma 848:17221) */
      .rf-head {
        margin-top: 20px;
        text-align: center;
        color: var(--deep);
      }
      .rf-head h1 {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.012em;
      }
      .rf-head p {
        font-size: 12px;
        line-height: 1.5;
        letter-spacing: 0.012em;
      }

      /* Illustration + Data Insights card, positioned as in the frame (centre-anchored) */
      .rf-stage {
        position: relative;
        height: 220px;
      }
      .rf-art {
        position: absolute;
        left: calc(50% - 136px);
        top: 14px;
        pointer-events: none;
      }
      .rf-insight {
        position: absolute;
        left: calc(50% + 19px);
        top: 30px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 153px;
        height: 139px;
        padding: 12px 16px;
        border-radius: var(--r-lg);
        background: var(--surface);
        box-shadow: 0 15px 40px #f1b5d2;
        transition:
          transform var(--t-fast) var(--ease),
          box-shadow var(--t-med) var(--ease);
      }
      .rf-insight:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 44px #eea9ca;
      }
      .rf-insight:active {
        transform: scale(0.98);
      }
      .rf-insight__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .rf-insight .tile-icon img {
        width: 28px;
        height: 28px;
      }
      .rf-insight .long-arrow {
        color: var(--deep);
      }
      .rf-insight__label {
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: var(--ink);
      }
      .rf-insight__title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.5;
        color: var(--deep);
      }

      /* Tabs sit on the bottom edge of the header (Figma underline 36–190 / 184–338) */
      .rf-tabs {
        margin-top: 4px;
        padding: 0 52px 0 36px;
        border-bottom-color: #d9d9d9;
      }
      .rf-tabs button {
        min-height: 52px;
        padding-bottom: 4px;
      }
      .rf-tabs button[aria-selected='true']::after {
        left: 0;
        right: 0;
      }
      .rf-tabs button:focus-visible {
        outline-offset: -4px;
      }

      /* ---------- Flag rows (Figma "results": 64px, flag ring hanging off the left) ---------- */
      .rf-panel {
        min-height: 295px; /* room for four rows, so Suggested Tools never jumps between tabs */
        padding: 15px 19px 0;
      }
      .rf-list {
        display: grid;
        gap: 8px;
      }
      .rf-row {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-height: 64px;
        padding: 10px 19px 10px 74px;
        isolation: isolate;
        transition: transform var(--t-fast) var(--ease);
      }
      .rf-row::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 0 0 0 12px;
        border-radius: var(--r-sm);
        background: linear-gradient(180deg, #fff, #f9f9f9);
        box-shadow: var(--shadow);
        transition: background-color var(--t-fast);
      }
      .rf-row:hover::before {
        background: linear-gradient(180deg, #fff, var(--lilac-dark));
      }
      .rf-row:active {
        transform: scale(0.985);
      }
      .rf-flag {
        position: absolute;
        left: 0;
        top: 50%;
        width: 60px;
        height: 60px;
        margin-top: -30px;
      }
      .rf-flag img {
        position: absolute;
        left: -12.7273px;
        top: -10.9091px;
        max-width: none;
      }
      .rf-row__text {
        flex: 1;
        min-width: 0;
        padding-top: 2px;
        color: var(--deep);
      }
      .rf-row__title {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: var(--deep);
      }
      .rf-row__sub {
        font-size: 12px;
        line-height: 1.3;
        letter-spacing: 0.012em;
      }
      /* "Learn more": the whole row is its hit area */
      .rf-more {
        flex: none;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: var(--deep);
      }
      .rf-more::after {
        content: '';
        position: absolute;
        inset: 0 0 0 12px;
        border-radius: var(--r-sm);
      }
      .rf-row:hover .rf-more {
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .rf-more:focus-visible {
        outline: none;
      }
      .rf-more:focus-visible::after {
        outline: 2px solid var(--plum);
        outline-offset: 2px;
      }

      .rf-cta {
        padding: 12px 18px 32px;
      }
      .rf-cta .btn {
        letter-spacing: 0.012em;
      }
    </style>
  </head>
  <body style="--status-bg: var(--pink-light)">
    <div class="app">
      <main class="screen screen--flush rf" id="main">
        <section class="rf-hero" aria-labelledby="rf-title">
          <div class="wash" data-wash="pink" data-glow=".rf-art" data-hills="112" aria-hidden="true"></div>
          <div class="rf-top">
            <a class="icon-btn icon-btn--soft rf-close" href="home.html" aria-label="Close and go to Home">
              <img src="assets/fig/icon-close-x.svg" width="24" height="24" alt="" />
            </a>
          </div>

          <section class="rf-level rise" aria-labelledby="lvl-t">
            <div>
              <p class="rf-level__label" id="lvl-t">Your river today</p>
              <p class="rf-level__num num">
                <span aria-hidden="true" data-level>–</span><span class="rf-level__of" aria-hidden="true">/ 6</span>
                <span class="sr-only" data-level-sr></span>
              </p>
              <span data-chip></span>
            </div>
            <div class="river" data-river-el></div>
          </section>

          <div class="rf-head rise" style="--d: 1">
            <h1 id="rf-title">Red Flags</h1>
            <p>Identifying Areas Needing Attention</p>
          </div>

          <div class="rf-stage rise" style="--d: 2">
            <div class="rf-art art art--arch art--lift" data-art="flag" style="--w: 104px; --h: 196px"></div>
            <a class="rf-insight" href="data.html">
              <span class="rf-insight__head">
                <span class="tile-icon"><img src="assets/fig/icon-bar-chart.svg" width="28" height="28" alt="" /></span>
                <span class="long-arrow" aria-hidden="true"></span>
              </span>
              <span>
                <span class="rf-insight__label">Data Insights</span>
                <span class="rf-insight__title" style="display: block">See my Data</span>
              </span>
            </a>
          </div>

          <div class="utabs rf-tabs" role="tablist" aria-label="Key areas">
            <button type="button" role="tab" id="t-productivity" aria-controls="p-productivity" aria-selected="true">Productivity</button>
            <button type="button" role="tab" id="t-wellbeing" aria-controls="p-wellbeing" aria-selected="false" tabindex="-1">Wellbeing</button>
          </div>
        </section>

        <div class="rf-panel" role="tabpanel" id="p-productivity" aria-labelledby="t-productivity">
          <ul class="rf-list" data-group="productivity"></ul>
        </div>
        <div class="rf-panel" role="tabpanel" id="p-wellbeing" aria-labelledby="t-wellbeing" hidden>
          <ul class="rf-list" data-group="wellbeing"></ul>
        </div>

        <div class="rf-cta">
          <a class="btn btn--primary btn--block" href="tools.html">Suggested Tools</a>
        </div>
      </main>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/art.js"></script>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const scores = RD.todayScores();
        const level = RD.level(scores);
        const zone = RD.zone(level);

        /* ---------- Today's level ---------- */
        document.querySelector('[data-chip]').innerHTML = RD.zoneChip(zone);
        document.querySelector('[data-level-sr]').textContent = `${RD.fmt.score(level)} out of 6`;
        RD.renderRiver(document.querySelector('[data-river-el]'), level);
        const levelEl = document.querySelector('[data-level]');
        if (reduce) levelEl.textContent = RD.fmt.score(level);
        else {
          // the number rises with the water
          const from = Math.max(1, level - 1.6);
          const t0 = performance.now();
          const tick = (t) => {
            const p = Math.min(1, (t - t0) / 1200);
            levelEl.textContent = RD.fmt.score(from + (level - from) * (1 - Math.pow(1 - p, 3)));
            if (p < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }

        /* ---------- Flag rows: a key area is flagged when any of its questions is in the red ---------- */
        const red = new Set(RD.flags(scores).map((a) => a.key));
        const row = (ka) => {
          const on = ka.of.some((k) => red.has(k));
          const pid = RD.pathwayFor(ka.of[0]);
          return `<li class="rf-row${on ? ' is-flagged' : ''}">
            <span class="rf-flag"><img src="assets/fig/flag-ring-${on ? 'red' : 'grey'}.svg" width="85.4545" height="85.4545" alt="${on ? 'Flagged' : 'Not flagged'}" /></span>
            <div class="rf-row__text">
              <h3 class="rf-row__title">${ka.name}</h3>
              <p class="rf-row__sub">${ka.sub}</p>
            </div>
            <a class="rf-more" href="pathway.html?id=${pid}">Learn more<span class="sr-only"> about ${ka.name}</span></a>
          </li>`;
        };
        document.querySelectorAll('.rf-list').forEach((ul) => {
          ul.innerHTML = RD.KEY_AREAS.filter((ka) => ka.group === ul.dataset.group).map(row).join('');
        });

        /* ---------- Tabs (roving focus, arrows / Home / End) ---------- */
        const tabs = [...document.querySelectorAll('.rf-tabs [role="tab"]')];
        function select(tab, focus) {
          tabs.forEach((t) => {
            const on = t === tab;
            t.setAttribute('aria-selected', String(on));
            t.tabIndex = on ? 0 : -1;
            const panel = document.getElementById(t.getAttribute('aria-controls'));
            panel.hidden = !on;
            if (on && !reduce)
              panel.querySelectorAll('.rf-row').forEach((r, i) =>
                r.animate(
                  [
                    { opacity: 0, transform: 'translateY(8px)' },
                    { opacity: 1, transform: 'none' },
                  ],
                  { duration: 360, delay: i * 50, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' }
                )
              );
          });
          if (focus) tab.focus();
        }
        tabs.forEach((t, i) => {
          t.addEventListener('click', () => select(t, false));
          t.addEventListener('keydown', (e) => {
            const n = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
            if (n == null) return;
            e.preventDefault();
            select(tabs[(n + tabs.length) % tabs.length], true);
          });
        });
        if (params.get('tab') === 'wellbeing') select(tabs[1], false);

        if (params.has('new') && RD.checkedInToday()) setTimeout(() => RD.toast('Check-in saved'), reduce ? 0 : 500);
      })();
    </script>
  </body>
</html>
