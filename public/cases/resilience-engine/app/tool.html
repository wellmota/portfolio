<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaff" />
    <title>Walking Mindfully · Resilience Dynamic</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/app.css" />
    <style>
      /* Figma: Tool — Walking Mindfully (848:15575 light, 848:15511 dark, 848:15639 long) and
         What is Good Sleep? (848:17565). Night/close row, illustration card, title, player, question card,
         Instruction, reflection. The player keeps the first round's structure (Part N of M, scrubber, ±15s). */
      :root {
        --tl-text: #27292c; /* Cold grey */
        --tl-sub: #4f4f4f; /* Gray 2 */
        --tl-card: #f5f6ff;
        --tl-ring: rgba(153, 215, 219, 0.3); /* Water @30%, light frame */
      }
      [data-theme='dark'] {
        --tl-text: #ffffff;
        --tl-sub: #d3d5e0;
        --tl-ring: rgba(208, 209, 255, 0.3); /* Violet Light @30%, dark frame */
      }

      .tl {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 0 var(--gutter) 32px;
        color: var(--tl-text);
      }

      /* ---------- Night / close ---------- */
      .tl-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 0 8px;
      }
      .tl-theme {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin: -4px 0 0 -4px;
        border-radius: var(--r-sm);
        transition: transform var(--t-fast) var(--ease);
      }
      .tl-theme::after {
        content: '';
        position: absolute;
        inset: -2px;
      }
      .tl-theme:active {
        transform: scale(0.92) rotate(-12deg);
      }
      .tl-theme img {
        width: 32px;
        height: 32px;
      }
      .tl-theme .is-sun,
      [data-theme='dark'] .tl-theme .is-moon {
        display: none;
      }
      [data-theme='dark'] .tl-theme .is-sun {
        display: block;
      }
      .tl-close {
        background: var(--lilac-dark);
        box-shadow: none;
      }

      /* ---------- Illustration card ---------- */
      .tl-art {
        position: relative;
        height: 240px;
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--tl-card);
        isolation: isolate;
      }
      .tl-art > svg {
        width: 100%;
        height: 100%;
        transform-origin: 50% 60%;
      }
      .is-playing .tl-art > svg {
        animation: drift 24s var(--ease) infinite alternate;
      }
      @keyframes drift {
        to {
          transform: scale(1.08);
        }
      }
      .tl-art .tl-play {
        position: absolute;
        left: calc(50% - 30px);
        bottom: 24px;
        transition:
          opacity var(--t-med) var(--ease),
          transform var(--t-fast) var(--ease);
      }
      .is-playing .tl-art .tl-play {
        opacity: 0;
      }
      .is-playing .tl-art:hover .tl-play,
      .is-playing .tl-art .tl-play:focus-visible {
        opacity: 1;
      }

      /* ---------- Meta, title, subtitle ---------- */
      .tl-head {
        display: grid;
        gap: 8px;
      }
      .tl-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.012em;
        color: var(--ink-3);
      }
      .tl-meta .i {
        width: 16px;
        height: 16px;
      }
      .tl-meta a {
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
      }
      .tl-title {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: 0.002em;
        color: var(--tl-text);
      }
      .tl-sub {
        font-size: 14px;
        line-height: 1.5;
        color: var(--tl-sub);
      }

      /* ---------- Player ---------- */
      .tl-player {
        display: grid;
        gap: 12px;
      }
      .now {
        padding: 16px;
        border-radius: var(--r-lg);
        background: var(--tl-card);
        color: #27292c;
      }
      .now__label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--plum);
      }
      .now__title {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.5;
        color: var(--deep);
      }
      .now__text {
        margin-top: 2px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: #4f4f4f;
      }
      .now.is-swapping .now__title,
      .now.is-swapping .now__text {
        animation: swap 420ms var(--ease);
      }
      @keyframes swap {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      /* little equaliser while playing */
      .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 10px;
        opacity: 0;
        transition: opacity var(--t-med);
      }
      .eq i {
        width: 2px;
        height: 100%;
        border-radius: 1px;
        background: currentColor;
        transform-origin: bottom;
        transform: scaleY(0.35);
      }
      .is-playing .eq {
        opacity: 1;
      }
      .is-playing .eq i {
        animation: eq 900ms ease-in-out infinite alternate;
      }
      .is-playing .eq i:nth-child(2) {
        animation-delay: -300ms;
      }
      .is-playing .eq i:nth-child(3) {
        animation-delay: -600ms;
      }
      @keyframes eq {
        to {
          transform: scaleY(1);
        }
      }

      /* Bar (Figma "bar"): 12px times either side, 6px track, violet fill, 16px plum thumb */
      .bar-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.012em;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }
      .bar-row span {
        min-width: 30px;
      }
      .bar-row span:first-child {
        text-align: right;
      }
      .scrub {
        --p: 0%;
        flex: 1;
        min-width: 0;
        height: 24px;
        margin: 0;
        background: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
      }
      .scrub::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--violet) var(--p), var(--line) var(--p));
      }
      .scrub::-moz-range-track {
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--violet) var(--p), var(--line) var(--p));
      }
      .scrub::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -5px;
        border: 0;
        border-radius: 50%;
        background: var(--plum);
        transition: transform var(--t-fast) var(--ease);
      }
      .scrub::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 50%;
        background: var(--plum);
      }
      .scrub:active::-webkit-slider-thumb {
        transform: scale(1.2);
      }
      .scrub:focus-visible {
        outline-offset: 4px;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .skip15 {
        position: relative;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        color: var(--ink-3);
        transition:
          color var(--t-fast),
          transform var(--t-fast) var(--ease);
      }
      .skip15:hover {
        color: var(--plum);
      }
      .skip15:active {
        transform: scale(0.92);
      }
      .skip15 .i {
        width: 32px;
        height: 32px;
        stroke-width: 1.5;
      }
      .skip15 span {
        position: absolute;
        font-size: 10px;
        font-weight: 700;
        padding-top: 2px;
      }
      /* Play/pause (Figma "play/pause" 60px): 30% ring, Violet disc, white glyph */
      .tl-play {
        position: relative;
        display: grid;
        place-items: center;
        width: 60px;
        height: 60px;
        flex: none;
        border-radius: 50%;
        background: var(--tl-ring);
        color: #fff;
        transition: transform var(--t-fast) var(--ease);
      }
      .tl-play::before {
        content: '';
        position: absolute;
        inset: 4.6px;
        border-radius: 50%;
        background: var(--violet);
        transition: background-color var(--t-fast);
      }
      .tl-play:hover::before {
        background: #8f92f2;
      }
      .tl-play:active {
        transform: scale(0.95);
      }
      /* the play glyph is drawn with its centroid on the viewBox centre, so it needs no optical nudge */
      .tl-play .i {
        position: relative;
        width: 18px;
        height: 18px;
      }

      /* ---------- Steps (read / exercise) ---------- */
      .tl-steps {
        padding: 4px 16px;
        border-radius: var(--r-lg);
        background: var(--tl-card);
        color: #27292c;
      }
      .tl-steps__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0 4px;
      }
      .tl-steps__head h2 {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--plum);
      }
      .tl-steps__head span {
        font-size: 12px;
        color: #5c6070;
      }
      .tl-step {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 12px;
        padding: 12px 0;
      }
      .tl-step + .tl-step {
        border-top: 1px solid var(--line);
      }
      .tl-step__num {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--violet-light);
        font-size: 12px;
        font-weight: 700;
        color: var(--deep);
      }
      .tl-tick {
        position: relative;
        width: 24px;
        height: 24px;
        border-radius: 50%;
      }
      .tl-tick::after {
        content: '';
        position: absolute;
        inset: -10px;
      }
      .tl-tick img {
        width: 24px;
        height: 24px;
      }
      .tl-tick .is-done,
      .tl-tick[aria-pressed='true'] .is-todo {
        display: none;
      }
      .tl-tick[aria-pressed='true'] .is-done {
        display: block;
        animation: pop 320ms var(--ease-spring);
      }
      @keyframes pop {
        from {
          transform: scale(0.6);
        }
      }
      .tl-step__title {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
        color: var(--deep);
      }
      .tl-step__text {
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: #4f4f4f;
      }
      .tl-step.is-ticked .tl-step__title {
        color: #596272;
      }

      /* ---------- Question card, Instruction, reflection (Figma copy styles) ---------- */
      .tl-question {
        padding: 16px;
        border-radius: var(--r-xs);
        background: var(--violet-light);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: #27292c;
      }
      .tl-copy {
        display: grid;
        gap: 18px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: var(--tl-text);
      }
      .tl-copy h2 {
        margin-bottom: 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--tl-text);
      }
      .tl-copy .tl-reflect {
        font-size: 16px;
        font-weight: 700;
        line-height: 1.5;
        letter-spacing: 0.012em;
        color: var(--tl-text);
      }
      .tl-copy--tight {
        gap: 16px;
      }
      .tl-journal {
        justify-self: start;
        min-height: 32px;
        font-size: 12px;
        color: var(--plum);
      }
      [data-theme='dark'] .tl-journal {
        color: var(--violet);
      }
      .tl-done {
        margin-top: 8px;
      }
      .tl-done.is-done {
        background: var(--surface);
        color: var(--plum);
        box-shadow: inset 0 0 0 1px var(--plum);
      }
      [data-theme='dark'] .tl-done.is-done {
        background: transparent;
        color: var(--violet);
        box-shadow: inset 0 0 0 1px var(--violet);
      }
      .tl-done .i {
        width: 20px;
        height: 20px;
        stroke-width: 2.4;
      }
      .tl-done small {
        font-size: 12px;
        font-weight: 500;
        opacity: 0.85;
      }
    </style>
  </head>
  <body data-themeable>
    <div class="app" id="app">
      <main class="screen screen--flush" id="main">
        <div class="tl">
          <div class="tl-top">
            <button type="button" class="tl-theme" id="theme" aria-label="Dark mode" aria-pressed="false">
              <img class="is-moon" src="assets/fig/icon-night.svg" width="32" height="32" alt="" />
              <img class="is-sun" src="assets/fig/icon-afternoon.svg" width="32" height="32" alt="" />
            </button>
            <a class="icon-btn tl-close" id="close" href="resources.html" data-back aria-label="Close">
              <img src="assets/fig/icon-close-x.svg" width="24" height="24" alt="" />
            </a>
          </div>

          <div class="tl-art rise" id="art" data-allow-overflow></div>

          <header class="tl-head rise" style="--d: 1">
            <p class="tl-meta" id="meta"></p>
            <h1 class="tl-title" id="title"></h1>
            <p class="tl-sub" id="summary"></p>
          </header>

          <div id="body" class="rise" style="--d: 2"></div>

          <p class="tl-question rise" style="--d: 3" id="question"></p>

          <section class="tl-copy rise" style="--d: 3" aria-labelledby="ins-t">
            <h2 id="ins-t">Instruction</h2>
            <div class="tl-copy" id="instruction"></div>
          </section>

          <section class="tl-copy tl-copy--tight" aria-labelledby="reflect-t">
            <h2 class="tl-reflect" id="reflect-t"></h2>
            <div class="tl-copy" id="reflect-text"></div>
            <a class="text-link tl-journal" id="journal-link" href="journal.html">Write your answer in your Journal <span class="long-arrow" aria-hidden="true"></span></a>
          </section>

          <div id="done-wrap"></div>
        </div>
      </main>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/art.js"></script>
    <script src="assets/app.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const root = document.documentElement;
        const app = $('app');
        const params = new URLSearchParams(location.search);
        const tool = RD.tool(params.get('id')) || RD.tool('walking-mindfully');

        /* Pathways this tool can be opened from (Contentedness and Demand vs Capacity mirror pathway.html) */
        const PATHWAYS = {
          sleep: { title: 'Sleep Pathway', steps: RD.PATHWAYS.sleep.steps },
          energy: { title: 'Energy Pathway', steps: RD.PATHWAYS.energy.steps },
          content: { title: 'Contentedness Pathway', steps: ['walking-mindfully', 'body-scan', 'find-autonomy', 'resilience-enablers'] },
          dvc: { title: 'Demand vs Capacity Pathway', steps: ['prioritisation', 'top-barriers', 'taking-responsibility', 'resilience-resources'] },
        };
        const pathwayId = PATHWAYS[params.get('pathway')] ? params.get('pathway') : null;
        const pathway = pathwayId ? PATHWAYS[pathwayId] : null;
        const DEFAULT_DONE = { sleep: ['good-sleep'] }; // same default as pathway.html (the frame shows step 1 done)

        /* ---------- Content ----------
           q: question card · ins: Instruction paragraphs · reflect: closing question (+ optional paragraphs)
           chapters: [startSecond, title, line] for audio/video · steps: [title, body] for read/exercise.
           Walking Mindfully, What is Good Sleep?, Body Scan and Resilience River use the Figma copy. */
        const C = {
          'walking-mindfully': {
            q: 'How often do you find yourself racing to get to your next destination and forgetting to take in the journey?',
            ins: [
              'Have you ever gone for a walk and only upon your return realised that you hadn’t noticed anything because your mind was so full? Practise walking mindfully in your day to day life. Appreciate the surroundings and discover how lovely things look!',
              'Listen to this audio and consider how you might walk with more awareness.',
            ],
            reflect: 'How might you bring awareness to each moment when you walk?',
            reflectText: [
              'Mindful walking offers an invitation to be present in the present moment. As you step forward, let go of the mental chatter and allow yourself to fully immerse in the experience of each step. Feel the ground beneath your feet, notice the gentle sway of your body, and take in the sights and sounds around you.',
              'By cultivating this sense of mindful awareness, you can transform a simple walk into a meaningful journey of discovery. Embrace the opportunity to appreciate the beauty that lies in every corner of your day-to-day life.',
            ],
            chapters: [
              [0, 'Arrive', 'Stand still for a moment. Feel your weight settle evenly through both feet.'],
              [40, 'Your feet', 'Walk at your usual pace. Notice each heel land, the foot roll, the toes push away.'],
              [105, 'Your breath', 'Let your breath find its own rhythm alongside your stride. No need to change it.'],
              [170, 'Sounds', 'Traffic, birdsong, your own footsteps. Let sounds arrive and fade without naming them.'],
              [230, 'What you see', 'Lift your gaze. Find one colour, one texture, one thing you have never noticed.'],
              [280, 'Carry it with you', 'Slow to a stop. Take one breath before you pick your day back up.'],
            ],
          },
          'body-scan': {
            q: 'Where in your body do you hold the day’s tension?',
            ins: [
              'Find somewhere quiet to sit or lie down. Listen to this audio and move your attention slowly from your toes to the crown of your head, noticing what you feel without trying to change it.',
            ],
            reflect: 'How might you introduce a body scan daily into your routine?',
            chapters: [
              [0, 'Settle', 'Sit or lie down where you will not be disturbed. Let your eyes close, or rest your gaze low.'],
              [60, 'Feet and legs', 'Bring attention to your toes, soles, ankles and calves. Notice warmth, pressure or tingling.'],
              [150, 'Hips and back', 'Feel where your body meets the chair or the floor. Let the lower back soften.'],
              [240, 'Hands and shoulders', 'Shoulders often carry the day. Let them drop, even by a centimetre.'],
              [330, 'Face and jaw', 'Unclench your jaw. Soften the space between your eyebrows and around your eyes.'],
              [410, 'The whole body', 'Feel your whole body breathing as one. Rest here for a few breaths before you open your eyes.'],
            ],
          },
          'resilience-river': {
            q: 'How high is your river running today?',
            ins: [
              'The Resilience River is a great way to check in with your resilience. Take a few minutes to watch our Resilience River video and understand how your resilience is today.',
            ],
            reflect: 'What one thing could you do to raise the river’s level?',
            chapters: [
              [0, 'Your river', 'Picture your resilience as a river. Some days it runs high, some days it runs low.'],
              [40, 'Rocks on the river bed', 'Pressures are like rocks. When the water is high you pass over them; when it is low you feel every one.'],
              [95, 'What raises the level', 'Sleep, energy, connection and recovery add water. Constant demand without a break drains it.'],
              [145, 'Reading your level', 'Your daily check-in is a gauge on the bank. It shows how much water you have today.'],
            ],
          },
          'good-sleep': {
            q: 'Do you know what quality sleep does for you, and how to get it?',
            ins: [
              'Watch this short video and see if you recognise what good sleep is. Do you get enough sleep? Do your natural sleep rhythm and your actual sleep pattern match up? What control and influence do you have over all of that? What one thing do you notice that might help your sleep right now?',
            ],
            reflect: 'What do you need to change to get a better sleep, more consistently?',
            chapters: [
              [0, 'Rhythm and pattern', 'You have a natural rhythm, when your body wants to sleep, and a pattern, when you actually do.'],
              [60, 'Larks and owls', 'Some of us are built for early nights and early starts; others come alive later. Neither is wrong.'],
              [130, 'Signs of a mismatch', 'An alarm every day, long weekend lie-ins and an afternoon slump all suggest the two are out of step.'],
              [195, 'Closing the gap', 'Shift in steps of fifteen minutes. Small moves are far easier to keep than one big change.'],
            ],
          },
          'resilience-enablers': {
            q: 'What helps you bounce forward after a hard week?',
            ins: ['Watch this short video about the people, habits and places that make it easier to recover, and notice which ones you already have.'],
            reflect: 'Which enabler could you make more room for this week?',
            chapters: [
              [0, 'Bouncing forward', 'Recovery is not going back to how things were. It is carrying something useful forward.'],
              [70, 'People', 'Who leaves you feeling lighter? A short call can do more than an evening alone.'],
              [150, 'Habits', 'Small, regular things: a walk at lunch, a proper break, a set finish time.'],
              [220, 'Places', 'Somewhere that helps you switch off. Notice where your shoulders drop.'],
            ],
          },
          'mapping-energy': {
            q: 'When in the day do you feel most energised, and when do you flag?',
            ins: ['Take ten minutes with a pen and paper. Work through the steps and tick each one off as you go.'],
            reflect: 'What drains your energy?',
            steps: [
              ['Draw yesterday', 'On paper or in your head, sketch a line from waking to sleep. Let it rise and fall with how energised you felt.'],
              ['Mark the peaks', 'Note what you were doing at your two highest points. Who were you with? What kind of work was it?'],
              ['Mark the dips', 'Do the same for the lowest points. Look for patterns: time of day, type of task, people, food.'],
              ['Sort fills from drains', 'List three things that filled your energy and three that drained it.'],
              ['Choose one swap', 'Pick one drain you could move, shorten or pair with something that fills you back up.'],
            ],
          },
          'energy-battery': {
            q: 'How charged is your battery right now?',
            ins: ['Picture your energy as a battery. Work through the steps to find ways to create surplus energy, not just spend it.'],
            reflect: 'What opportunities might you have to top your energy up?',
            steps: [
              ['Check the charge', 'Picture your energy as a battery. Where is it right now: full, half, nearly flat?'],
              ['List what charges it', 'Write down what tops you up. A run, lunch away from the desk, a call with a friend.'],
              ['List what spends it', 'Now what runs it down. Be specific: “the Monday planning meeting”, not “work”.'],
              ['Plan a top-up', 'Organising your tasks keeps you afloat; surplus comes from charging before you are empty. Book one top-up before your next low point.'],
            ],
          },
          'improve-sleep': {
            q: 'What gets in the way of a good night’s sleep for you?',
            ins: ['If you want to improve your sleep, consider these top tips. Pick the one that feels easiest to start with: small changes, kept up for a few weeks, make the biggest difference.'],
            reflect: 'Which one change will you try this week, and what might get in the way?',
            steps: [
              ['Keep one wake-up time', 'Get up at the same time every day, weekends included, give or take half an hour. It anchors everything else.'],
              ['Get daylight early', 'Ten minutes outside before 10am tells your body clock that the day has started.'],
              ['Set a caffeine cut-off', 'Caffeine stays in your system for hours. Make 2pm your last coffee or tea.'],
              ['Build a wind-down', 'Give the last half hour before bed the same few steps each night: dim lights, no email.'],
              ['Keep the bedroom for sleep', 'Cool, dark and quiet. Charge your phone in another room.'],
              ['If you can’t sleep, get up', 'After about twenty minutes awake, go somewhere else and do something calm until you feel sleepy.'],
            ],
          },
          'taking-responsibility': {
            q: 'Do you often find yourself carrying more than your share?',
            ins: ['Understand the importance of taking and also giving responsibility. Read the four ideas below and notice where in your week you take on what isn’t yours.'],
            reflect: 'What are you carrying that isn’t yours to carry?',
            steps: [
              ['Taking responsibility', 'Owning what is yours: your choices, your responses, your part in how a situation plays out.'],
              ['Giving responsibility', 'Handing back what belongs to someone else. Not everything that lands on your desk is yours to carry.'],
              ['Spot the over-carry', 'Listen for “I’ll just do it myself”. That is often where energy quietly leaks away.'],
              ['Hand one thing back', 'Choose one task or worry this week and return it, clearly and kindly, to its owner.'],
            ],
          },
          'resilience-resources': {
            q: 'What do you lean on when things get hard?',
            ins: ['Explore your resources and how you can better equip yourself. Work through the prompts and tick each one once you have an answer.'],
            reflect: 'Which resource have you forgotten, and how could you return to it this week?',
            steps: [
              ['People', 'Name three people: one for practical help, one who listens, one who makes you laugh.'],
              ['Places and activities', 'Where do you recover? A walking route, the swimming pool, a particular bench or kitchen table.'],
              ['Strengths', 'What has got you through hard weeks before? Name a habit or a skill, not a personality trait.'],
              ['The ones you’ve forgotten', 'Look back five years. What did you rely on then that you have quietly stopped doing?'],
            ],
          },
          'resilience-dynamic': {
            q: 'Do you think of resilience as something you either have or don’t?',
            ins: ['Understand the levels of your resilience and how this can change. Read the four ideas below.'],
            reflect: 'Where would you place yourself today, and what moved you there?',
            steps: [
              ['Not a fixed trait', 'Resilience is not something you either have or lack. It moves with what is happening, day to day.'],
              ['Levels, not labels', 'In a good week you may be thriving; in a stretched one, simply getting through. Both are normal places to be.'],
              ['What moves you', 'Demand pulls your level down; capacity, energy and recovery lift it. Your check-in tracks all seven areas.'],
              ['Act early', 'Amber is the moment to adjust. Small changes there cost far less than climbing back out of the red.'],
            ],
          },
          'top-barriers': {
            q: 'What gets in the way of your resilience?',
            ins: ['Find out what can get in the way of your resilience. Read through the most common barriers and notice which ones sound familiar.'],
            reflect: 'Which barrier gets in your way most, and when does it show up?',
            steps: [
              ['Always on', 'No clear end to the working day. Messages follow you home and recovery never quite starts.'],
              ['Yes by default', 'Taking on more before checking what you are already carrying.'],
              ['Skipping the basics', 'Sleep, food and movement are the first to go under pressure, and the last you can afford to lose.'],
              ['Going it alone', 'Not asking for help because everyone else looks just as busy.'],
              ['Name yours', 'Which one shows up most for you? Naming it is the first step to working around it.'],
            ],
          },
          'find-autonomy': {
            q: 'Where do you have more control than you think?',
            ins: ['Read these ideas, then sort one current worry into what you can change and what you can only influence.'],
            reflect: 'What is one thing within your control that you could act on today?',
            steps: [
              ['Two lists', 'Write down what is on your mind. Split it into what you can change and what you can only influence.'],
              ['Act on the first list', 'Pick the smallest thing you can change and do it today. Momentum matters more than size.'],
              ['Influence the second', 'For what you cannot change, ask: who could I talk to, and what could I ask for?'],
              ['Let the rest go', 'Some things sit outside both lists. Noticing that is a relief, not a failure.'],
            ],
          },
          prioritisation: {
            q: 'Does what is asked of you match what you have to give?',
            ins: ['Work through these steps with this week’s list in front of you. Tick each one as you go.'],
            reflect: 'What could you let go of this week, and who needs to know?',
            steps: [
              ['Empty the list', 'Write down everything asking for your time this week, large and small.'],
              ['Check your capacity', 'Be honest about the hours and energy you actually have, not the ones you wish you had.'],
              ['Sort into three', 'Must do, could do, could let go. The last column is usually longer than it first looks.'],
              ['Renegotiate one thing', 'Pick one “could do” to move, delegate or decline. Write the sentence you will use.'],
            ],
          },
        };
        const timed = tool.kind === 'audio' || tool.kind === 'video';
        const content =
          C[tool.id] ||
          (timed
            ? { q: tool.summary, ins: [tool.summary], reflect: 'What did you notice?', chapters: [[0, 'Begin', tool.summary]] }
            : { q: tool.summary, ins: [tool.summary], reflect: 'What did you notice?', steps: [['Begin', tool.summary]] });
        const kind = RD.KINDS[tool.kind];
        const isVideo = tool.kind === 'video';

        /* ---------- Header ---------- */
        document.title = `${tool.title} · Resilience Dynamic`;
        $('art').innerHTML = RD.art(tool.art);
        $('title').textContent = tool.title;
        $('summary').textContent = tool.summary;

        let stepIndex = -1;
        const collection = RD.COLLECTIONS.find((c) => c.tools.includes(tool.id));
        let where = RD.esc(tool.collection);
        if (pathway) {
          stepIndex = pathway.steps.indexOf(tool.id);
          where = `<a href="pathway.html?id=${pathwayId}">${pathway.title}</a>${stepIndex > -1 ? ` · Step ${stepIndex + 1} of ${pathway.steps.length}` : ''}`;
          $('close').href = `pathway.html?id=${pathwayId}`;
        } else if (collection) {
          $('close').href = `resources.html?c=${collection.id}`;
        }
        $('meta').innerHTML = `${RD.icon(kind.icon)}<span>${kind.label} · ${RD.fmt.mins(tool.mins)} · ${where}</span>`;
        if (pathway) $('close').setAttribute('aria-label', `Close, back to ${pathway.title}`);

        $('question').textContent = content.q;
        $('instruction').innerHTML = content.ins.map((p) => `<p>${RD.esc(p)}</p>`).join('');
        $('reflect-t').textContent = content.reflect;
        $('reflect-text').innerHTML = (content.reflectText || []).map((p) => `<p>${RD.esc(p)}</p>`).join('');
        if (!content.reflectText) $('reflect-text').remove();
        $('journal-link').href = `journal.html?new=1&tool=${encodeURIComponent(tool.id)}&q=${encodeURIComponent(content.reflect)}`;

        /* ---------- Dark / light (Figma: night icon in light, afternoon icon in dark) ---------- */
        const themeBtn = $('theme');
        const metaTheme = document.querySelector('meta[name="theme-color"]');
        function paintTheme() {
          const dark = root.dataset.theme === 'dark';
          themeBtn.setAttribute('aria-pressed', String(dark));
          metaTheme.setAttribute('content', dark ? '#27292c' : '#fafaff');
        }
        themeBtn.addEventListener('click', () => {
          const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
          const apply = () => {
            root.dataset.theme = next;
            paintTheme();
          };
          RD.store.set('theme', next);
          if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(apply);
          else apply();
        });
        paintTheme();

        /* ---------- Player (simulated) ---------- */
        const fmt = (s) => {
          s = Math.max(0, Math.round(s));
          return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        };
        const spoken = (s) => {
          s = Math.round(s);
          const m = Math.floor(s / 60), r = s % 60;
          const mm = m ? `${m} minute${m === 1 ? '' : 's'}` : '';
          const ss = r || !m ? `${r} second${r === 1 ? '' : 's'}` : '';
          return [mm, ss].filter(Boolean).join(' ');
        };
        const ICON_PLAY = RD.icon('play', 'i-play');
        const ICON_PAUSE = RD.icon('pause');

        if (timed) {
          const dur = tool.mins * 60;
          const chapters = content.chapters;
          let pos = 0, playing = false, last = 0, raf = 0, chap = -1;

          if (isVideo) {
            $('art').insertAdjacentHTML('beforeend', `<button type="button" class="tl-play" data-play aria-label="Play video" aria-pressed="false">${ICON_PLAY}</button>`);
          }
          $('body').innerHTML = `
            <section class="tl-player" aria-label="${kind.label} player">
              <div class="now" id="now">
                <p class="now__label"><span id="now-label">Part 1 of ${chapters.length}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></p>
                <p class="now__title" id="now-title"></p>
                <p class="now__text" id="now-text"></p>
              </div>
              <div class="bar-row">
                <span id="el" aria-hidden="true">0:00</span>
                <label class="sr-only" for="scrub">Playback position</label>
                <input class="scrub" id="scrub" type="range" min="0" max="${dur}" step="1" value="0" />
                <span aria-hidden="true">${fmt(dur)}</span>
              </div>
              <div class="controls">
                <button type="button" class="skip15" id="back15" aria-label="Back 15 seconds">${RD.icon('skip-back')}<span aria-hidden="true">15</span></button>
                <button type="button" class="tl-play" data-play aria-label="Play" aria-pressed="false">${ICON_PLAY}</button>
                <button type="button" class="skip15" id="fwd15" aria-label="Forward 15 seconds">${RD.icon('skip-fwd')}<span aria-hidden="true">15</span></button>
              </div>
            </section>`;

          const scrub = $('scrub');
          const playBtns = [...document.querySelectorAll('[data-play]')];
          const chapterAt = (p) => chapters.reduce((i, [t], k) => (p >= t ? k : i), 0);

          function paint() {
            scrub.value = Math.floor(pos);
            scrub.style.setProperty('--p', `${(pos / dur) * 100}%`);
            scrub.setAttribute('aria-valuetext', `${spoken(pos)} of ${spoken(dur)}`);
            $('el').textContent = fmt(pos);
            const c = chapterAt(pos);
            if (c !== chap) {
              chap = c;
              const [, title, line] = chapters[c];
              const now = $('now');
              $('now-label').textContent = `Part ${c + 1} of ${chapters.length}`;
              $('now-title').textContent = title;
              $('now-text').textContent = line;
              now.classList.remove('is-swapping');
              void now.offsetWidth;
              now.classList.add('is-swapping');
            }
          }
          function paintState() {
            app.classList.toggle('is-playing', playing);
            playBtns.forEach((b) => {
              b.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
              b.setAttribute('aria-pressed', String(playing));
              b.setAttribute('aria-label', b.closest('.tl-art') ? 'Play video' : pos >= dur ? 'Play again' : 'Play');
            });
          }
          function tick(t) {
            pos = Math.min(dur, pos + (t - last) / 1000);
            last = t;
            paint();
            if (pos >= dur) return finish();
            raf = requestAnimationFrame(tick);
          }
          function play() {
            if (pos >= dur) pos = 0;
            playing = true;
            last = performance.now();
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(tick);
            paintState();
          }
          function pause() {
            playing = false;
            cancelAnimationFrame(raf);
            paintState();
          }
          function finish() {
            pause();
            RD.toast('Session complete. Take a breath before you move on.', 'sparkles');
          }
          function seek(p) {
            pos = Math.max(0, Math.min(dur, p));
            paint();
            paintState();
          }
          const toggle = () => (playing ? pause() : play());

          playBtns.forEach((b) => b.addEventListener('click', toggle));
          $('back15').addEventListener('click', () => seek(pos - 15));
          $('fwd15').addEventListener('click', () => seek(pos + 15));
          scrub.addEventListener('input', () => seek(+scrub.value));
          scrub.addEventListener('keydown', (e) => {
            const step = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -30, PageUp: 30 }[e.key];
            if (step) {
              e.preventDefault();
              seek(pos + step);
            }
          });
          /* Space plays/pauses unless the focus is on something Space already operates */
          document.addEventListener('keydown', (e) => {
            if (e.key !== ' ' || e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
            if (e.target.closest('button, a, input, textarea, select, [contenteditable], [role="slider"]')) return;
            e.preventDefault();
            toggle();
          });
          window.addEventListener('pagehide', pause);

          /* Deterministic deep links for screenshots: ?t=seconds */
          if (params.has('t')) seek(+params.get('t') || 0);
          paint();
          paintState();
        } else {
          /* ---------- Steps: read (numbered) / exercise (tick off, Figma check circles) ----------
             No player to listen to first, so the question and the Instruction lead into the steps */
          $('instruction').closest('section').after($('body'));
          const steps = content.steps;
          const isExercise = tool.kind === 'exercise';
          const total = steps.length;
          $('body').innerHTML = `<section class="tl-steps" aria-labelledby="steps-t">
              <div class="tl-steps__head"><h2 id="steps-t">${isExercise ? 'How to do it' : 'What to know'}</h2>
                <span id="steps-count" aria-live="polite">${isExercise ? `0 of ${total} done` : `${total} parts · ${RD.fmt.mins(tool.mins)} read`}</span></div>
              <ol>${steps
                .map(
                  ([title, body], i) => `<li class="tl-step">
                    ${
                      isExercise
                        ? `<button type="button" class="tl-tick" aria-pressed="false" aria-label="Step ${i + 1}, ${RD.esc(title)}: done">
                            <img class="is-todo" src="assets/fig/icon-checkbox-empty.svg" width="24" height="24" alt="" />
                            <img class="is-done" src="assets/fig/icon-checkbox-full.svg" width="24" height="24" alt="" /></button>`
                        : `<span class="tl-step__num" aria-hidden="true">${i + 1}</span>`
                    }
                    <div><h3 class="tl-step__title">${RD.esc(title)}</h3><p class="tl-step__text">${RD.esc(body)}</p></div>
                  </li>`
                )
                .join('')}</ol></section>`;
          if (isExercise) {
            const ticks = [...document.querySelectorAll('.tl-tick')];
            ticks.forEach((b) =>
              b.addEventListener('click', () => {
                const on = b.getAttribute('aria-pressed') !== 'true';
                b.setAttribute('aria-pressed', String(on));
                b.closest('.tl-step').classList.toggle('is-ticked', on);
                const n = ticks.filter((t) => t.getAttribute('aria-pressed') === 'true').length;
                $('steps-count').textContent = n === total ? 'All steps done' : `${n} of ${total} done`;
              })
            );
          }
        }

        /* ---------- Mark as done (only when opened from a pathway) ---------- */
        if (pathway && stepIndex > -1) {
          const KEY = 'pathway:' + pathwayId;
          const read = () => {
            const s = RD.store.get(KEY, DEFAULT_DONE[pathwayId] || []);
            return Array.isArray(s) ? s : [];
          };
          $('done-wrap').innerHTML = `<button type="button" class="btn btn--primary btn--block tl-done" id="done"></button>`;
          const doneBtn = $('done');
          const paintDone = () => {
            const on = read().includes(tool.id);
            doneBtn.classList.toggle('is-done', on);
            doneBtn.innerHTML = on
              ? `${RD.icon('check')}<span>Done · Back to pathway</span>`
              : `<span>Mark as done</span><small>Step ${stepIndex + 1} of ${pathway.steps.length}</small>`;
          };
          paintDone();
          doneBtn.addEventListener('click', () => {
            const list = read();
            if (!list.includes(tool.id)) {
              RD.store.set(KEY, [...list, tool.id]);
              paintDone();
              RD.toast('Step done. Nice work.', 'check');
            }
            const fromPathway = document.referrer && new URL(document.referrer).pathname.endsWith('/pathway.html');
            setTimeout(() => {
              if (fromPathway && history.length > 1) history.back();
              else location.href = `pathway.html?id=${pathwayId}`;
            }, 600);
          });
        }

        /* bfcache: keep the theme in sync when returning to this page */
        window.addEventListener('pageshow', (e) => {
          if (!e.persisted) return;
          const t = RD.store.get('theme');
          if (t) root.dataset.theme = t;
          paintTheme();
        });
      })();
    </script>
  </body>
</html>
