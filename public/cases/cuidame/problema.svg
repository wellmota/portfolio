<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="O problema: dois anos no mesmo ciclo de retrabalho, antes da minha entrada">
<style>
  .mono{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.18em;text-transform:uppercase}
  .cap{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.04em;text-transform:uppercase}
  .sans{font-family:-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .b{font-weight:700;letter-spacing:-.02em}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c92"/></marker>
  <marker id="arrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cff24a"/></marker>
</defs>
<rect width="1200" height="760" fill="#0a0a0a"/>
<path d="M33,40 H47 M40,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M33,720 H47 M40,713 V727" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,40 H1167 M1160,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,720 H1167 M1160,713 V727" stroke="#3a3a3a" stroke-width="1"/><text x="40" y="52" class="mono" font-size="14" fill="#8c8c92">02 — O problema</text><text x="1160" y="52" class="mono" font-size="14" fill="#8c8c92" text-anchor="end">2024 → 2026 · antes da minha entrada</text><path d="M40,78 H1160" stroke="#232323" stroke-width="1"/><circle cx="330" cy="430" r="190" fill="none" stroke="#232323" stroke-width="1"/><path d="M395,251 A190,190 0 0 1 517,463" fill="none" stroke="#8c8c92" stroke-width="1.5" marker-end="url(#arr)"/><path d="M452,576 A190,190 0 0 1 208,576" fill="none" stroke="#8c8c92" stroke-width="1.5" marker-end="url(#arr)"/><path d="M143,463 A190,190 0 0 1 265,251" fill="none" stroke="#8c8c92" stroke-width="1.5" marker-end="url(#arr)"/><circle cx="330" cy="240" r="58" fill="#101010" stroke="#3a3a3a" stroke-width="1"/><text x="330" y="228" class="mono" font-size="12" fill="#cff24a" text-anchor="middle">01</text><text x="330" y="256" class="sans b" font-size="19" fill="#ededed" text-anchor="middle">Pedido</text><text x="330" y="148" class="cap" font-size="12" fill="#5a5a60" text-anchor="middle">briefing vago</text><circle cx="495" cy="525" r="58" fill="#101010" stroke="#3a3a3a" stroke-width="1"/><text x="495" y="513" class="mono" font-size="12" fill="#cff24a" text-anchor="middle">02</text><text x="495" y="541" class="sans b" font-size="19" fill="#ededed" text-anchor="middle">Entrega</text><text x="495" y="617" class="cap" font-size="12" fill="#5a5a60" text-anchor="middle">fora do esperado</text><circle cx="165" cy="525" r="58" fill="#101010" stroke="#3a3a3a" stroke-width="1"/><text x="165" y="513" class="mono" font-size="12" fill="#cff24a" text-anchor="middle">03</text><text x="165" y="541" class="sans b" font-size="19" fill="#ededed" text-anchor="middle">Retrabalho</text><text x="165" y="617" class="cap" font-size="12" fill="#5a5a60" text-anchor="middle">refaz do zero</text><text x="330" y="436" class="sans b" font-size="54" fill="#ededed" text-anchor="middle">2 anos</text><text x="330" y="470" class="cap" font-size="13" fill="#8c8c92" text-anchor="middle"><tspan x="330" dy="0">no mesmo ciclo,</tspan><tspan x="330" dy="20">com outro time</tspan></text><text x="660" y="176" class="sans b" font-size="34" fill="#ededed" text-anchor="start"><tspan x="660" dy="0">Pedia-se uma coisa,</tspan><tspan x="660" dy="42">entregava-se outra.</tspan></text><path d="M660,258 H1160" stroke="#232323" stroke-width="1"/><text x="660" y="292" class="mono" font-size="12" fill="#cff24a">01</text><text x="716" y="294" class="sans" font-size="22" fill="#ededed">Escopo sem detalhe</text><path d="M660,338 H1160" stroke="#232323" stroke-width="1"/><text x="660" y="372" class="mono" font-size="12" fill="#cff24a">02</text><text x="716" y="374" class="sans" font-size="22" fill="#ededed">Expectativa divergente a cada entrega</text><path d="M660,418 H1160" stroke="#232323" stroke-width="1"/><text x="660" y="452" class="mono" font-size="12" fill="#cff24a">03</text><text x="716" y="454" class="sans" font-size="22" fill="#ededed">Retrabalho sem critério de pronto</text><path d="M660,560 H1160" stroke="#cff24a" stroke-width="1" opacity=".6"/><path d="M390,240 C 560,240 600,590 660,590" fill="none" stroke="#cff24a" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#arrl)"/><text x="680" y="596" class="mono" font-size="13" fill="#cff24a" text-anchor="start"><tspan x="680" dy="0">Minha entrada: empatia primeiro,</tspan><tspan x="680" dy="22">mapear tudo, só então prometer prazo</tspan></text></svg>