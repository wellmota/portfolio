<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="O método: do workshop ao protótipo aprovado, que vira produção">
<style>
  .mono{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.18em;text-transform:uppercase}
  .cap{font-family:ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace;letter-spacing:.04em;text-transform:uppercase}
  .sans{font-family:-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
  .b{font-weight:700;letter-spacing:-.02em}
</style>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c8c92"/></marker>
  <marker id="arrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cff24a"/></marker>
</defs>
<rect width="1200" height="820" fill="#0a0a0a"/>
<path d="M33,40 H47 M40,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M33,780 H47 M40,773 V787" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,40 H1167 M1160,33 V47" stroke="#3a3a3a" stroke-width="1"/><path d="M1153,780 H1167 M1160,773 V787" stroke="#3a3a3a" stroke-width="1"/><text x="40" y="52" class="mono" font-size="14" fill="#8c8c92">03 — O método</text><text x="1160" y="52" class="mono" font-size="14" fill="#8c8c92" text-anchor="end">Workshop → beta em 1 semana · 0 handoff</text><path d="M40,78 H1160" stroke="#232323" stroke-width="1"/><path d="M150,340 H1050" stroke="#3a3a3a" stroke-width="1"/><circle cx="150" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="150" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">01</text><text x="150" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="150" dy="0">Workshop de</tspan><tspan x="150" dy="28">mapeamento</tspan></text><text x="150" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="150" dy="0">tela a tela, fluxo a fluxo,</tspan><tspan x="150" dy="20">com as duas stakeholders,</tspan><tspan x="150" dy="20">antes de qualquer prazo</tspan></text><circle cx="375" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="375" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">02</text><text x="375" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="375" dy="0">Heurísticas</tspan><tspan x="375" dy="28">antes do teste</tspan></text><text x="375" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="375" dy="0">boas práticas e heurísticas</tspan><tspan x="375" dy="20">aplicadas no desenho,</tspan><tspan x="375" dy="20">não no bug</tspan></text><circle cx="600" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="600" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">03</text><text x="600" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="600" dy="0">Protótipo</tspan><tspan x="600" dy="28">na stack</tspan></text><text x="600" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="600" dy="0">navegável, em Expo,</tspan><tspan x="600" dy="20">com dados reais:</tspan><tspan x="600" dy="20">mão na massa</tspan></text><circle cx="825" cy="340" r="26" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1"/><text x="825" y="345" class="mono" font-size="13" fill="#ededed" text-anchor="middle">04</text><text x="825" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="825" dy="0">Teste com</tspan><tspan x="825" dy="28">a cliente</tspan></text><text x="825" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="825" dy="0">elas usam no celular;</tspan><tspan x="825" dy="20">crítica, ajuste,</tspan><tspan x="825" dy="20">ciclos até 100%</tspan></text><circle cx="1050" cy="340" r="26" fill="#0a0a0a" stroke="#cff24a" stroke-width="1.5"/><text x="1050" y="345" class="mono" font-size="13" fill="#cff24a" text-anchor="middle">05</text><text x="1050" y="196" class="sans b" font-size="24" fill="#ededed" text-anchor="middle"><tspan x="1050" dy="0">Refino visual</tspan><tspan x="1050" dy="28">direto</tspan></text><text x="1050" y="400" class="cap" font-size="12" fill="#8c8c92" text-anchor="middle"><tspan x="1050" dy="0">ajuste e re-teste</tspan><tspan x="1050" dy="20">no mesmo dia,</tspan><tspan x="1050" dy="20">sem burocracia</tspan></text><path d="M1036,316 C 980,262 895,262 841,316" fill="none" stroke="#8c8c92" stroke-width="1.5" marker-end="url(#arr)"/><text x="937" y="256" class="cap" font-size="11" fill="#5a5a60" text-anchor="middle">ciclos</text><path d="M1050,370 V372" stroke="#cff24a" stroke-width="1.5" opacity=".5"/><path d="M1050,462 V560" stroke="#cff24a" stroke-width="1.5" marker-end="url(#arrl)"/><rect x="100" y="560" width="1000" height="160" fill="#101010" stroke="#232323" stroke-width="1"/><text x="140" y="608" class="mono" font-size="13" fill="#cff24a">Protótipo aprovado</text><text x="140" y="668" class="sans b" font-size="40" fill="#ededed">= pronto para produção</text><text x="1060" y="610" class="cap" font-size="12" fill="#8c8c92" text-anchor="end"><tspan x="1060" dy="0">1 semana: workshop, redesign</tspan><tspan x="1060" dy="24">e 100% do front-end</tspan><tspan x="1060" dy="24">pronto para beta testers</tspan></text></svg>